<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector de Pases - AN PASS</title>

  <!-- HTML5 QR Code Reader -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- Fuentes Elegantes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #fcfbfa;
      --card-bg: #ffffff;
      --text-main: #2c2825;
      --text-muted: #78716c;
      --accent-color: #2c2825;
      --border-color: #eae6df;
      --radius-main: 16px;
      --shadow-subtle: 0 10px 30px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      padding: 24px 16px 40px 16px;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .brand-tag {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent-color);
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
      opacity: 0.85;
    }

    .event-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 30px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.1;
    }

    .reader-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-main);
      box-shadow: var(--shadow-subtle);
      padding: 16px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: none !important;
    }

    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-main);
      box-shadow: var(--shadow-subtle);
      padding: 20px;
      display: none;
    }

    .guest-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .code-tag {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
      background: rgba(0,0,0,0.02);
      padding: 12px;
      border-radius: 12px;
      text-align: center;
    }

    .info-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 600;
    }

    .info-lbl {
      font-size: 9px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .action-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .input-cant {
      width: 60px;
      height: 44px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      outline: none;
    }

    .btn-action {
      flex: 1;
      height: 44px;
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn-reset {
      width: 100%;
      height: 40px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 11px;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  
  <header class="header">
    <span class="brand-tag">CONTROL DE ACCESO</span>
    <h1 class="event-title" id="tituloEvento">Cargando evento...</h1>
  </header>

  <div class="reader-card">
    <div id="reader"></div>
  </div>

  <div id="resultCard" class="result-card">
    <div class="guest-name" id="resNombre">-</div>
    <div class="code-tag">Código: <span id="resCodigo">-</span></div>

    <div class="info-grid">
      <div>
        <div class="info-num" id="resAutorizadas">0</div>
        <div class="info-lbl">Pases</div>
      </div>
      <div>
        <div class="info-num" id="resIngresaron">0</div>
        <div class="info-lbl">Dentro</div>
      </div>
      <div>
        <div class="info-num" id="resRestantes" style="color: #2e6027;">0</div>
        <div class="info-lbl">Restantes</div>
      </div>
    </div>

    <div class="action-group" id="secAccion">
      <input type="number" id="cantIngreso" class="input-cant" value="1" min="1">
      <button class="btn-action" onclick="marcarEntrada()">Registrar Entrada</button>
    </div>

    <button class="btn-reset" onclick="reiniciarEscaner()">Escanear Otro Pase</button>
  </div>

</div>

<script>
  const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbxd7P-bKlxZAYbd1yHJHxT4sOWRpRuLGIlWNqG4gWt-3dFAmETStniOaZbNlxa2ui2QCA/exec';
  const urlParams = new URLSearchParams(window.location.search);

  let ID_EVENTO = urlParams.get('evento') || 'EV001';
  if (ID_EVENTO.includes('](')) {
    ID_EVENTO = ID_EVENTO.split('](')[0].replace('[', '');
  }
  ID_EVENTO = ID_EVENTO.trim();

  let html5QrcodeScanner = null;
  let paseActual = null;

  function aplicarColores(color, colorFondo, colorBoton) {
    const root = document.documentElement;
    if (colorFondo) root.style.setProperty('--bg-color', colorFondo);
    if (color) root.style.setProperty('--text-main', color);
    if (colorBoton) root.style.setProperty('--accent-color', colorBoton);
    else if (color) root.style.setProperty('--accent-color', color);
  }

  function cargarEvento() {
    fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ accion: 'obtenerDatosPanel', id_evento: ID_EVENTO })
    })
    .then(res => res.json())
    .then(res => {
      if (res.ok && res.evento) {
        document.getElementById('tituloEvento').textContent = res.evento.nombre;
        aplicarColores(res.evento.color, res.evento.color_fondo, res.evento.color_boton);
      }
    })
    .catch(() => {});
  }

  function inicializarEscaner() {
    html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 220 });
    html5QrcodeScanner.render(onScanSuccess);
  }

  function onScanSuccess(decodedText) {
    let codigo = decodedText;
    if (decodedText.includes('codigo=')) {
      codigo = decodedText.split('codigo=')[1].split('&')[0];
    }

    html5QrcodeScanner.clear();
    buscarPase(codigo);
  }

  function buscarPase(codigo) {
    fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ accion: 'buscarPase', id_evento: ID_EVENTO, codigo: codigo })
    })
    .then(res => res.json())
    .then(res => {
      if (res.ok && res.pase) {
        paseActual = res.pase;
        mostrarPase(res.pase);
      } else {
        alert('❌ Pase no encontrado o no pertenece a este evento.');
        reiniciarEscaner();
      }
    })
    .catch(() => {
      alert('Error al verificar el pase.');
      reiniciarEscaner();
    });
  }

  function mostrarPase(p) {
    document.getElementById('resultCard').style.display = 'block';
    document.getElementById('resNombre').textContent = p.invitado;
    document.getElementById('resCodigo').textContent = p.codigo;
    document.getElementById('resAutorizadas').textContent = p.autorizadas;
    document.getElementById('resIngresaron').textContent = p.ingresaron;
    document.getElementById('resRestantes').textContent = p.restantes;

    const cant = document.getElementById('cantIngreso');
    cant.value = p.restantes > 0 ? 1 : 0;
    cant.max = p.restantes;

    if (p.restantes <= 0) {
      document.getElementById('secAccion').style.display = 'none';
    } else {
      document.getElementById('secAccion').style.display = 'flex';
    }
  }

  function marcarEntrada() {
    if (!paseActual) return;
    const cant = parseInt(document.getElementById('cantIngreso').value) || 1;

    fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        accion: 'registrarEntrada',
        id_evento: ID_EVENTO,
        codigo: paseActual.codigo,
        cantidad: cant
      })
    })
    .then(res => res.json())
    .then(res => {
      if (res.ok) {
        alert('✅ Entrada registrada con éxito');
        buscarPase(paseActual.codigo);
      } else {
        alert('❌ Error: ' + res.mensaje);
      }
    })
    .catch(() => alert('Error de conexión'));
  }

  function reiniciarEscaner() {
    document.getElementById('resultCard').style.display = 'none';
    paseActual = null;
    inicializarEscaner();
  }

  cargarEvento();
  inicializarEscaner();
</script>

</body>
</html>

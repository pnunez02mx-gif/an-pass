<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Acceso - AN PASS</title>

  <!-- Librería de QR -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- Fuentes Elegantes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #fcfbfa;
      --card-bg: #ffffff;
      --text-main: #2c2825;
      --text-muted: #78716c;
      --accent-color: #2c2825;
      --border-color: #eae6df;
      --radius-main: 16px;
      --shadow-subtle: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      padding: 20px 16px 40px 16px;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .brand-tag {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent-color);
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
      opacity: 0.85;
    }

    .event-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 30px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.1;
    }

    /* ESTADÍSTICAS DEL EVENTO (TEXTOS CORREGIDOS) */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 4px;
      text-align: center;
      box-shadow: var(--shadow-subtle);
    }

    .stat-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1;
    }

    .stat-lbl {
      font-size: 8px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-top: 6px;
      font-weight: 600;
      line-height: 1.2;
    }

    /* BOTÓN ESCÁNER CON ÍCONO */
    .btn-scan-main {
      width: 100%;
      height: 52px;
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-subtle);
    }

    /* SECCIÓN DE CÁMARA */
    .scanner-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-main);
      padding: 14px;
      margin-bottom: 20px;
      display: none;
      box-shadow: var(--shadow-subtle);
    }

    .controls-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      justify-content: center;
    }

    .btn-ctrl {
      background: #faf9f7;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    #reader {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      border: none !important;
    }

    /* TARJETA DETALLE DEL INVITADO */
    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-main);
      box-shadow: var(--shadow-subtle);
      padding: 24px 20px;
      margin-bottom: 20px;
      display: none;
      text-align: center;
    }

    .badge-estado {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      background: #eef7ed;
      color: #2e6027;
      margin-bottom: 10px;
    }

    .guest-name-res {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 600;
      color: var(--text-main);
    }

    .code-res {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      background: rgba(0,0,0,0.02);
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .info-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 600;
    }

    .info-lbl {
      font-size: 9px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* CONTADOR CON BOTONES CIRCULARES (+ Y -) */
    .counter-section {
      margin: 20px 0;
    }

    .counter-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 14px;
    }

    .counter-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    .btn-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--text-main);
      color: #ffffff;
      border: none;
      font-size: 24px;
      font-weight: 400;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, opacity 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .btn-circle:active { transform: scale(0.92); }
    .btn-circle:disabled { opacity: 0.2; cursor: not-allowed; }

    .counter-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 42px;
      font-weight: 600;
      color: var(--text-main);
      min-width: 40px;
    }

    .btn-entry-main {
      width: 100%;
      height: 50px;
      background: var(--text-main);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: var(--shadow-subtle);
      transition: background-color 0.2s ease;
    }

    .btn-close-card {
      width: 100%;
      height: 38px;
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 10px;
      font-size: 11px;
      margin-top: 10px;
      cursor: pointer;
    }

    /* BUSCADOR Y LISTA DE INVITADOS */
    .search-box {
      margin-bottom: 14px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 12px 16px 12px 38px;
      border-radius: 12px;
      font-size: 13px;
      font-family: 'Montserrat', sans-serif;
      color: var(--text-main);
      outline: none;
      box-shadow: var(--shadow-subtle);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 13px;
    }

    .guest-list-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .guest-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-subtle);
      cursor: pointer;
    }

    .item-name {
      font-weight: 600;
      font-size: 14px;
      color: var(--text-main);
    }

    .item-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .item-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: #eef7ed;
      color: #2e6027;
    }

    .item-badge.UTILIZADO { background: #fde8e8; color: #9b1c1c; }
    .item-badge.PARCIAL { background: #fff8e6; color: #946800; }

    .status-msg {
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 14px;
      text-align: center;
      display: none;
    }
    .status-msg.success { background: #eef7ed; color: #2e6027; }
    .status-msg.error { background: #fde8e8; color: #9b1c1c; }
  </style>
</head>
<body>

<div class="container">
  
  <header class="header">
    <span class="brand-tag">CONTROL DE ACCESO</span>
    <h1 class="event-title" id="tituloEvento">Control de Acceso</h1>
  </header>

  <!-- MÉTRICAS EN TIEMPO REAL -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-num" id="stAutorizadas">0</div>
      <div class="stat-lbl">PERSONAS AUTORIZADAS</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stConfirmadas">0</div>
      <div class="stat-lbl">CONFIRMADAS</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stIngresaron">0</div>
      <div class="stat-lbl">YA INGRESARON</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stPorcentaje">0%</div>
      <div class="stat-lbl">AVANCE</div>
    </div>
  </div>

  <!-- BOTÓN PARA ABRIR CÁMARA -->
  <button class="btn-scan-main" id="btnToggleCam" onclick="toggleCamara()">
    <span>📷</span> ESCANEAR PASE
  </button>

  <!-- CÁMARA ESCÁNER -->
  <div class="scanner-box" id="scannerBox">
    <div class="controls-bar">
      <button class="btn-ctrl" onclick="cambiarCamara()">🔄 Cambiar Cámara</button>
      <button class="btn-ctrl" id="btnFlash" onclick="alternarFlash()" style="display:none;">⚡ Flash</button>
    </div>
    <div id="reader"></div>
  </div>

  <!-- TARJETA CON CONTADOR + / - DE PERSONAS -->
  <div class="result-card" id="resultCard">
    <div class="badge-estado" id="resEstado">🟢 PASE VÁLIDO</div>
    <div class="guest-name-res" id="resNombre">-</div>
    <div class="code-res">Código: <span id="resCodigo">-</span></div>

    <div id="statusMsg" class="status-msg"></div>

    <div class="info-grid">
      <div>
        <div class="info-num" id="resAutorizadas">0</div>
        <div class="info-lbl">AUTORIZADAS</div>
      </div>
      <div>
        <div class="info-num" id="resIngresaron">0</div>
        <div class="info-lbl">YA INGRESARON</div>
      </div>
    </div>

    <!-- CONTADOR CON BOTONES DE MÁS Y MENOS -->
    <div id="secContador" class="counter-section">
      <div class="counter-title">¿Cuántas personas están entrando?</div>
      <div class="counter-controls">
        <button class="btn-circle" id="btnMenos" onclick="modificarCantidad(-1)">−</button>
        <div class="counter-value" id="valCantidad">1</div>
        <button class="btn-circle" id="btnMas" onclick="modificarCantidad(1)">+</button>
      </div>
      <button class="btn-entry-main" id="btnRegistrar" onclick="marcarEntrada()">
        ✅ REGISTRAR 1 PERSONA
      </button>
    </div>

    <button class="btn-close-card" onclick="cerrarDetallePase()">Cerrar / Escanear Otro</button>
  </div>

  <!-- BUSCADOR -->
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" class="search-input" placeholder="Buscar invitado por nombre o código..." onkeyup="filtrarLista()">
  </div>

  <!-- LISTA DE INVITADOS -->
  <div class="guest-list-container" id="listaInvitados">
    <p style="text-align: center; font-size:12px; color:var(--text-muted); padding:20px;">Cargando lista de invitados...</p>
  </div>

</div>

<script>
  const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbxd7P-bKlxZAYbd1yHJHxT4sOWRpRuLGIlWNqG4gWt-3dFAmETStniOaZbNlxa2ui2QCA/exec';
  const urlParams = new URLSearchParams(window.location.search);

  let ID_EVENTO = urlParams.get('evento') || 'EV001';
  if (ID_EVENTO.includes('](')) {
    ID_EVENTO = ID_EVENTO.split('](')[0].replace('[', '');
  }
  ID_EVENTO = ID_EVENTO.trim();

  let html5QrCode = null;
  let camaraActiva = false;
  let camaraFacing = "environment";
  let flashEncendido = false;

  let datosGlobales = { resumen: {}, invitados: [] };
  let paseSeleccionado = null;
  let cantidadIngreso = 1;

  function aplicarColores(color, colorFondo, colorBoton) {
    const root = document.documentElement;
    if (colorFondo) root.style.setProperty('--bg-color', colorFondo);
    if (color) root.style.setProperty('--text-main', color);
    if (colorBoton) root.style.setProperty('--accent-color', colorBoton);
    else if (color) root.style.setProperty('--accent-color', color);
  }

  function cargarPanel() {
    fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ accion: 'obtenerDatosPanel', id_evento: ID_EVENTO })
    })
    .then(res => res.json())
    .then(res => {
      if (!res.ok) {
        document.getElementById('listaInvitados').innerHTML = `<p style="text-align:center;color:red;font-size:12px;">${res.mensaje}</p>`;
        return;
      }

      if (res.evento) {
        document.getElementById('tituloEvento').textContent = res.evento.nombre;
        aplicarColores(res.evento.color, res.evento.color_fondo, res.evento.color_boton);
      }

      datosGlobales.resumen = res.resumen || {};
      datosGlobales.invitados = res.invitados || [];

      actualizarResumen();
      renderizarLista(datosGlobales.invitados);
    })
    .catch(() => {
      document.getElementById('listaInvitados').innerHTML = '<p style="text-align:center;color:red;font-size:12px;">Error al cargar los datos.</p>';
    });
  }

  function actualizarResumen() {
    const r = datosGlobales.resumen;
    document.getElementById('stAutorizadas').textContent = r.autorizadas || 0;
    document.getElementById('stConfirmadas').textContent = r.confirmadas || 0;
    document.getElementById('stIngresaron').textContent = r.ingresaron || 0;
    document.getElementById('stPorcentaje').textContent = (r.porcentaje || 0) + '%';
  }

  function renderizarLista(invitados) {
    const cont = document.getElementById('listaInvitados');

    if (!invitados || invitados.length === 0) {
      cont.innerHTML = '<p style="text-align:center; font-size:12px; color:var(--text-muted); padding:20px;">No se encontraron invitados.</p>';
      return;
    }

    let html = '';
    invitados.forEach(inv => {
      html += `
        <div class="guest-item" onclick="seleccionarPase('${inv.codigo}')">
          <div>
            <div class="item-name">${inv.invitado}</div>
            <div class="item-sub">Código: ${inv.codigo} | Restantes: ${inv.restantes} de ${inv.autorizadas}</div>
          </div>
          <span class="item-badge ${inv.estado}">${inv.estado}</span>
        </div>
      `;
    });
    cont.innerHTML = html;
  }

  function filtrarLista() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const filtrados = datosGlobales.invitados.filter(i => 
      (i.invitado || '').toLowerCase().includes(q) || 
      (i.codigo || '').toLowerCase().includes(q)
    );
    renderizarLista(filtrados);
  }

  function seleccionarPase(codigo) {
    const pase = datosGlobales.invitados.find(i => i.codigo === codigo);
    if (!pase) return;

    paseSeleccionado = pase;
    cantidadIngreso = pase.restantes > 0 ? 1 : 0;

    document.getElementById('resultCard').style.display = 'block';
    document.getElementById('resNombre').textContent = pase.invitado;
    document.getElementById('resCodigo').textContent = pase.codigo;
    document.getElementById('resAutorizadas').textContent = pase.autorizadas;
    document.getElementById('resIngresaron').textContent = pase.ingresaron;

    const msg = document.getElementById('statusMsg');
    const badge = document.getElementById('resEstado');

    if (pase.restantes <= 0) {
      badge.textContent = '🔴 PASE AGOTADO';
      badge.style.background = '#fde8e8';
      badge.style.color = '#9b1c1c';

      document.getElementById('secContador').style.display = 'none';
      msg.className = 'status-msg error';
      msg.textContent = '⛔ ESTE PASE YA NO TIENE LUGARES DISPONIBLES';
      msg.style.display = 'block';
    } else {
      badge.textContent = '🟢 PASE VÁLIDO';
      badge.style.background = '#eef7ed';
      badge.style.color = '#2e6027';

      document.getElementById('secContador').style.display = 'block';
      msg.style.display = 'none';
      actualizarContadorUI();
    }

    window.scrollTo({ top: document.getElementById('resultCard').offsetTop - 20, behavior: 'smooth' });
  }

  function modificarCantidad(delta) {
    if (!paseSeleccionado) return;
    const nuevaCant = cantidadIngreso + delta;

    if (nuevaCant >= 1 && nuevaCant <= paseSeleccionado.restantes) {
      cantidadIngreso = nuevaCant;
      actualizarContadorUI();
    }
  }

  function actualizarContadorUI() {
    document.getElementById('valCantidad').textContent = cantidadIngreso;

    const btnMenos = document.getElementById('btnMenos');
    const btnMas = document.getElementById('btnMas');
    const btnReg = document.getElementById('btnRegistrar');

    btnMenos.disabled = (cantidadIngreso <= 1);
    btnMas.disabled = (cantidadIngreso >= paseSeleccionado.restantes);

    const txtPersona = cantidadIngreso === 1 ? 'PERSONA' : 'PERSONAS';
    btnReg.textContent = `✅ REGISTRAR ${cantidadIngreso} ${txtPersona}`;
  }

  function cerrarDetallePase() {
    document.getElementById('resultCard').style.display = 'none';
    document.getElementById('statusMsg').style.display = 'none';
    paseSeleccionado = null;
  }

  function toggleCamara() {
    const box = document.getElementById('scannerBox');
    const btn = document.getElementById('btnToggleCam');

    if (camaraActiva) {
      detenerCamara();
      box.style.display = 'none';
      btn.innerHTML = '<span>📷</span> ESCANEAR PASE';
    } else {
      box.style.display = 'block';
      btn.innerHTML = '<span>❌</span> CERRAR CÁMARA';
      iniciarCamara();
    }
  }

  function iniciarCamara() {
    html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 220, height: 220 } };

    html5QrCode.start(
      { facingMode: camaraFacing },
      config,
      onScanSuccess
    ).then(() => {
      camaraActiva = true;
      const caps = html5QrCode.getRunningTrackCapabilities();
      if (caps && caps.torch) {
        document.getElementById('btnFlash').style.display = 'inline-block';
      }
    }).catch(() => alert("No se pudo iniciar la cámara."));
  }

  function detenerCamara() {
    if (html5QrCode && camaraActiva) {
      html5QrCode.stop().then(() => { camaraActiva = false; }).catch(() => { camaraActiva = false; });
    }
  }

  function cambiarCamara() {
    camaraFacing = (camaraFacing === "environment") ? "user" : "environment";
    detenerCamara();
    setTimeout(iniciarCamara, 300);
  }

  function alternarFlash() {
    flashEncendido = !flashEncendido;
    if (html5QrCode) {
      html5QrCode.applyVideoConstraints({ advanced: [{ torch: flashEncendido }] });
    }
  }

  function onScanSuccess(decodedText) {
    let codigo = decodedText;
    if (decodedText.includes('codigo=')) {
      codigo = decodedText.split('codigo=')[1].split('&')[0];
    }
    seleccionarPase(codigo);
  }

  function marcarEntrada() {
    if (!paseSeleccionado) return;

    fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        accion: 'registrarEntrada',
        id_evento: ID_EVENTO,
        codigo: paseSeleccionado.codigo,
        cantidad: cantidadIngreso
      })
    })
    .then(res => res.json())
    .then(res => {
      const msg = document.getElementById('statusMsg');
      if (res.ok) {
        msg.className = 'status-msg success';
        msg.textContent = '✅ Entrada registrada con éxito.';
        msg.style.display = 'block';

        cargarPanel(); // Actualizar datos globales
        setTimeout(() => seleccionarPase(paseSeleccionado.codigo), 500);
      } else {
        msg.className = 'status-msg error';
        msg.textContent = '❌ ' + (res.mensaje || 'Error al registrar.');
        msg.style.display = 'block';
      }
    })
    .catch(() => alert('Error de conexión'));
  }

  cargarPanel();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta 
name="viewport" 
content="width=device-width, initial-scale=1"
>

<title>AN PASS - Confirmación</title>


<style>

*{
box-sizing:border-box;
}

body{

margin:0;

background:#f7f3ed;

color:#292522;

font-family:Arial,sans-serif;

}


.app{

width:100%;

max-width:500px;

margin:auto;

padding:30px 18px 60px;

}


header{

text-align:center;

margin-bottom:25px;

}


.logo{

font-family:Georgia,serif;

font-size:32px;

line-height:.8;

letter-spacing:3px;

}


.logo span{

font-size:20px;

letter-spacing:6px;

}


.subtitulo{

margin-top:15px;

font-size:9px;

letter-spacing:3px;

color:#766b60;

}


.tarjeta{

background:white;

border:1px solid #e5ddd2;

border-radius:22px;

padding:25px 18px;

box-shadow:0 5px 18px rgba(70,60,50,.07);

text-align:center;

}


.nombreFamilia{

font-family:Georgia,serif;

font-size:27px;

margin:5px 0 10px;

}


.descripcion{

color:#706860;

font-size:13px;

line-height:1.5;

margin-bottom:20px;

}


.cantidad{

background:#f7f3ed;

border-radius:15px;

padding:18px;

margin-bottom:20px;

}


.cantidad strong{

display:block;

font-family:Georgia,serif;

font-size:38px;

margin-bottom:5px;

}


.cantidad small{

font-size:9px;

font-weight:bold;

letter-spacing:1px;

}


.campo{

text-align:left;

margin-bottom:13px;

}


.campo label{

display:block;

font-size:9px;

font-weight:bold;

margin-bottom:6px;

}


.campo input{

width:100%;

padding:13px;

border:1px solid #ddd3c7;

border-radius:12px;

background:white;

font-size:14px;

outline:none;

}


.boton{

width:100%;

border:0;

border-radius:13px;

padding:16px;

background:#292522;

color:white;

font-size:14px;

font-weight:bold;

cursor:pointer;

margin-top:8px;

}


.boton:disabled{

opacity:.6;

cursor:wait;

}


.mensaje{

text-align:center;

padding:10px 5px;

}


.icono{

font-size:52px;

margin-bottom:10px;

}


.error{

color:#8b443b;

}


.cargando{

text-align:center;

color:#706860;

padding:30px 10px;

}


.listaNombres{

background:#f7f3ed;

border-radius:15px;

padding:15px;

text-align:left;

margin-top:20px;

}


.listaNombres strong{

display:block;

font-size:10px;

letter-spacing:1px;

margin-bottom:9px;

}


.listaNombres div{

font-size:13px;

padding:5px 0;

border-bottom:1px solid #e6ddd2;

}


.listaNombres div:last-child{

border-bottom:0;

}


.qrTitulo{

margin-top:28px;

font-size:12px;

font-weight:bold;

letter-spacing:2px;

}


.qr{

display:block;

width:220px;

height:220px;

margin:15px auto;

border-radius:8px;

}


.nota{

color:#766b60;

font-size:10px;

line-height:1.5;

margin-top:15px;

}


</style>

</head>


<body>


<div class="app">


<header>

<div class="logo">
AN<br>
<span>PASS</span>
</div>


<div class="subtitulo">
CONFIRMACIÓN DE ASISTENCIA
</div>


</header>


<div id="contenido">

<div class="tarjeta">

<div class="cargando">
Cargando invitación...
</div>

</div>

</div>


</div>


<script>


// ===============================
// CONFIGURACIÓN
// ===============================


const URL_APPS_SCRIPT =
'https://script.google.com/macros/s/AKfycbxd7P-bKlxZAYbd1yHJHxT4sOWRpRuLGIlWNqG4gWt-3dFAmETStniOaZbNlxa2ui2QCA/exec';


// ===============================
// DATOS URL
// ===============================


const parametros =
new URLSearchParams(
window.location.search
);


const codigo =
String(
parametros.get('codigo') || ''
)
.trim();


const idEvento =
String(
parametros.get('evento') || ''
)
.trim()
.toUpperCase();
  // ===============================
// API
// ===============================


function solicitarAPI(
  accion,
  payload={}
){

payload.accion = accion;


return fetch(
URL_APPS_SCRIPT,
{

method:'POST',

mode:'cors',

headers:{

'Content-Type':
'text/plain;charset=utf-8'

},

body:
JSON.stringify(payload)

}

)

.then(function(res){

return res.json();

});

}



// ===============================
// SEGURIDAD
// ===============================


function escapar(texto){

if(
texto===null ||
texto===undefined
){

return '';

}


return String(texto)

.replace(
/&/g,
'&amp;'
)

.replace(
/</g,
'&lt;'
)

.replace(
/>/g,
'&gt;'
)

.replace(
/"/g,
'&quot;'
)

.replace(
/'/g,
'&#039;'
);

}



// ===============================
// INICIO
// ===============================


window.onload=function(){


if(
!codigo ||
!idEvento
){

mostrarError(
'Esta invitación no tiene evento asignado.'
);

return;

}


cargarInvitacion();


};




// ===============================
// CARGAR INVITACIÓN
// ===============================


function cargarInvitacion(){


solicitarAPI(

'obtenerDatosConfirmacion',

{

codigo:codigo,

idEvento:idEvento

}

)


.then(function(datos){


if(
!datos ||
!datos.ok
){

mostrarError(

datos?.mensaje ||

'La invitación no existe.'

);

return;

}



mostrarFormulario(datos);



})


.catch(function(){

mostrarError(

'No pudimos conectar con el sistema.'

);

});


}





// ===============================
// FORMULARIO
// ===============================


function mostrarFormulario(datos){


const contenido =
document.getElementById(
'contenido'
);



let campos='';



for(
let i=1;
i<=datos.personas;
i++
){


campos += `


<div class="campo">


<label>

NOMBRE DEL INVITADO ${i}

</label>



<input

type="text"

id="nombre${i}"

placeholder="Nombre completo"

autocomplete="name"

>


</div>


`;


}




contenido.innerHTML = `


<div class="tarjeta">


<div class="nombreFamilia">

${escapar(datos.invitado)}

</div>



<div class="descripcion">

Nos dará mucho gusto contar contigo.

Por favor confirma quiénes asistirán.

</div>




<div class="cantidad">


<strong>

${datos.personas}

</strong>


<small>

PASES DISPONIBLES

</small>


</div>



${campos}



<button

class="boton"

id="botonConfirmar"

>

CONFIRMAR ASISTENCIA

</button>



</div>


`;



document

.getElementById(
'botonConfirmar'
)

.addEventListener(

'click',

confirmar

);


}





// ===============================
// ENVIAR CONFIRMACIÓN
// ===============================


function confirmar(){


const nombres=[];



for(
let i=1;
i<=100;
i++
){


const campo =

document.getElementById(
'nombre'+i
);



if(!campo)
break;



const nombre =
campo.value.trim();



if(!nombre){


alert(

'Escribe el nombre del invitado '+i

);


campo.focus();


return;


}



nombres.push(nombre);



}




const boton =

document.getElementById(
'botonConfirmar'
);



boton.disabled=true;


boton.textContent=
'CONFIRMANDO...';



solicitarAPI(

'confirmarAsistencia',

{


codigo:codigo,


idEvento:idEvento,


nombres:nombres


}

)



.then(function(respuesta){


if(
!respuesta ||
!respuesta.ok
){


alert(

respuesta?.mensaje ||

'No se pudo confirmar.'

);



boton.disabled=false;


boton.textContent=

'CONFIRMAR ASISTENCIA';



return;


}



mostrarConfirmacionNueva(
respuesta
);



})



.catch(function(){


alert(
'Error al confirmar.'
);


boton.disabled=false;


boton.textContent=

'CONFIRMAR ASISTENCIA';



});


}




// ===============================
// PANTALLA FINAL
// ===============================


function mostrarConfirmacionNueva(datos){


const contenido =

document.getElementById(
'contenido'
);



let lista='';



(datos.nombres || [])

.forEach(function(nombre){


lista += `

<div>

${escapar(nombre)}

</div>

`;


});



const textoQR =

'https://pnunez02mx-gif.github.io/an-pass/?evento='

+ idEvento

+ '&codigo='

+ datos.codigo;



const qrURL =

'https://quickchart.io/qr?size=500&text='

+

encodeURIComponent(
textoQR
);




contenido.innerHTML=`


<div class="tarjeta">


<div class="mensaje">


<div class="icono">

✅

</div>


<h2>

¡Asistencia confirmada!

</h2>



<p>

Gracias por confirmar.

</p>



</div>



<div class="listaNombres">


<strong>

INVITADOS CONFIRMADOS

</strong>


${lista}


</div>




<div class="qrTitulo">

TU PASE QR

</div>




<img

class="qr"

src="${qrURL}"

>


<div class="nota">


Guarda este código QR para el acceso.


<br><br>


Este pase pertenece únicamente a este evento.


</div>



</div>


`;



}

 
// ===============================
// MOSTRAR ERROR
// ===============================


function mostrarError(
mensaje
){


document.getElementById(
'contenido'
)

.innerHTML = `


<div class="tarjeta">


<div class="mensaje error">


<div class="icono">

❌

</div>



<h2>

No pudimos abrir tu invitación

</h2>



<p>

${escapar(mensaje)}

</p>



</div>


</div>


`;


}




</script>


</body>

</html>

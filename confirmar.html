<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>AN PASS - Confirmación</title>


<style>

/* =====================================================
   GENERAL
   ===================================================== */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{

  margin:0;

  background:#f7f3ed;

  color:#292522;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  -webkit-font-smoothing:antialiased;

}


/* =====================================================
   CONTENEDOR
   ===================================================== */

.app{

  width:100%;

  max-width:500px;

  margin:0 auto;

  padding:
    28px
    18px
    60px;

}


/* =====================================================
   ENCABEZADO
   ===================================================== */

header{

  text-align:center;

  margin-bottom:24px;

}

.logo{

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:32px;

  line-height:.8;

  letter-spacing:3px;

  color:#292522;

}

.logo span{

  font-size:20px;

  letter-spacing:6px;

}

.subtitulo{

  margin-top:15px;

  font-size:9px;

  letter-spacing:3px;

  color:#766b60;

}


/* =====================================================
   TARJETA
   ===================================================== */

.tarjeta{

  width:100%;

  background:#ffffff;

  border:
    1px solid
    #e5ddd2;

  border-radius:22px;

  padding:
    25px
    18px
    22px;

  box-shadow:
    0 5px 18px
    rgba(70,60,50,.07);

  text-align:center;

}


/* =====================================================
   NOMBRE
   ===================================================== */

.nombreFamilia{

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:27px;

  line-height:1.2;

  margin:
    5px 0 10px;

  color:#292522;

}


/* =====================================================
   DESCRIPCIÓN
   ===================================================== */

.descripcion{

  color:#706860;

  font-size:13px;

  line-height:1.5;

}


/* =====================================================
   PASES DISPONIBLES
   ===================================================== */

.cantidad{

  background:#f7f3ed;

  border-radius:15px;

  padding:18px;

  margin:20px 0;

}

.cantidad strong{

  display:block;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:38px;

  line-height:1;

  color:#292522;

}

.cantidad small{

  display:block;

  margin-top:6px;

  font-size:9px;

  font-weight:bold;

  letter-spacing:1px;

  color:#292522;

}


/* =====================================================
   CAMPOS
   ===================================================== */

.campo{

  width:100%;

  text-align:left;

  margin-bottom:14px;

}

.campo label{

  display:block;

  font-size:9px;

  font-weight:bold;

  margin-bottom:6px;

  color:#292522;

}

.campo input{

  display:block;

  width:100%;

  height:46px;

  padding:
    12px
    13px;

  border:
    1px solid
    #ddd3c7;

  border-radius:12px;

  background:#ffffff;

  color:#292522;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size:14px;

  outline:none;

  -webkit-appearance:none;

  appearance:none;

}

.campo input:focus{

  border-color:#8b8177;

  box-shadow:
    0 0 0 3px
    rgba(118,107,96,.10);

}

.campo input::placeholder{

  color:#aaa29a;

}


/* =====================================================
   ZONA DEL BOTÓN
   ===================================================== */

#zonaBoton{

  display:block;

  width:100%;

  min-height:52px;

  margin-top:22px;

}


/* =====================================================
   BOTÓN CONFIRMAR
   ===================================================== */

button.boton{

  display:block !important;

  visibility:visible !important;

  opacity:1 !important;

  position:relative;

  z-index:20;

  width:100% !important;

  min-width:100%;

  height:52px;

  margin:0 !important;

  padding:
    15px
    18px;

  border:none !important;

  outline:none;

  border-radius:13px;

  background:#292522 !important;

  color:#ffffff !important;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size:14px;

  font-weight:bold;

  letter-spacing:.4px;

  line-height:normal;

  text-align:center;

  cursor:pointer;

  box-shadow:none;

  -webkit-appearance:none;

  appearance:none;

}

button.boton:hover{

  background:#3a3531 !important;

}

button.boton:active{

  transform:scale(.98);

}

button.boton:disabled{

  opacity:.6 !important;

  cursor:not-allowed;

  transform:none;

}


/* =====================================================
   MENSAJES
   ===================================================== */

.mensaje{

  text-align:center;

  padding:15px;

}

.icono{

  font-size:52px;

  line-height:1;

  margin-bottom:10px;

}

.mensaje h2{

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  color:#292522;

  margin:
    10px 0;

}

.mensaje p{

  color:#706860;

  font-size:13px;

  line-height:1.5;

}


/* =====================================================
   LISTA DE INVITADOS
   ===================================================== */

.listaNombres{

  background:#f7f3ed;

  border-radius:15px;

  padding:15px;

  margin-top:20px;

  text-align:left;

}

.listaNombres strong{

  display:block;

  font-size:10px;

  letter-spacing:1px;

  margin-bottom:10px;

  color:#292522;

}

.listaNombres div{

  padding:7px 0;

  border-bottom:
    1px solid
    #e5ddd2;

  font-size:13px;

  color:#292522;

}

.listaNombres div:last-child{

  border-bottom:none;

}


/* =====================================================
   QR
   ===================================================== */

h3{

  margin:
    25px 0 5px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:18px;

  font-weight:normal;

  color:#292522;

}

.qr{

  display:block;

  width:220px;

  height:220px;

  margin:
    15px auto;

}


/* =====================================================
   ERROR
   ===================================================== */

.error{

  color:#8b443b;

}

.error h2{

  color:#8b443b;

}


/* =====================================================
   CELULARES PEQUEÑOS
   ===================================================== */

@media(max-width:380px){

  .app{

    padding:
      22px
      14px
      45px;

  }

  .tarjeta{

    padding:
      22px
      15px
      20px;

  }

  .nombreFamilia{

    font-size:24px;

  }

  .cantidad strong{

    font-size:34px;

  }

  .qr{

    width:200px;

    height:200px;

  }

}

</style>

</head>


<body>


<div class="app">


  <!-- =================================================
       ENCABEZADO
       ================================================= -->

  <header>

    <div class="logo">

      AN<br>

      <span>PASS</span>

    </div>


    <div class="subtitulo">

      CONFIRMACIÓN DE ASISTENCIA

    </div>

  </header>


  <!-- =================================================
       CONTENIDO
       ================================================= -->

  <div id="contenido">

    <div class="tarjeta">

      <div class="mensaje">

        Cargando invitación...

      </div>

    </div>

  </div>


</div>



<script>


// =====================================================
// CONFIGURACIÓN
// =====================================================

const URL_APPS_SCRIPT =
'https://script.google.com/macros/s/AKfycbxd7P-bKlxZAYbd1yHJHxT4sOWRpRuLGIlWNqG4gWt-3dFAmETStniOaZbNlxa2ui2QCA/exec';


// =====================================================
// DATOS DE LA URL
// =====================================================

const parametros =
new URLSearchParams(
  window.location.search
);


const codigo =
String(
  parametros.get('codigo') || ''
)
.trim();


const evento =
String(
  parametros.get('evento') || ''
)
.trim()
.toUpperCase();


// =====================================================
// CONEXIÓN CON GOOGLE APPS SCRIPT
// =====================================================

function solicitarAPI(

  accion,

  datos={}

){

  datos.accion =
    accion;

  datos.idEvento =
    evento;


  return fetch(

    URL_APPS_SCRIPT,

    {

      method:'POST',

      mode:'cors',

      headers:{

        'Content-Type':
          'text/plain;charset=utf-8'

      },

      body:
        JSON.stringify(datos)

    }

  )

  .then(

    respuesta =>

      respuesta.json()

  );

}


// =====================================================
// SEGURIDAD DE TEXTO
// =====================================================

function escapar(texto){

  if(

    texto === null ||

    texto === undefined

  ){

    return '';

  }


  return String(texto)

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


// =====================================================
// INICIO
// =====================================================

window.onload =
function(){

  if(

    !codigo ||

    !evento

  ){

    mostrarError(
      'Código o evento incorrecto.'
    );

    return;

  }


  cargarInvitacion();

};


// =====================================================
// CARGAR INVITACIÓN
// =====================================================

function cargarInvitacion(){

  solicitarAPI(

    'obtenerDatosConfirmacion',

    {

      codigo:
        codigo

    }

  )

  .then(

    function(datos){


      if(

        !datos ||

        !datos.ok

      ){

        mostrarError(

          datos?.mensaje ||

          'La invitación no existe.'

        );

        return;

      }


      /*
       * Si ya fue confirmada,
       * mostrar directamente el pase QR.
       */

      if(

        String(
          datos.confirmacion || ''
        )
        .trim()
        .toUpperCase()

        ===

        'CONFIRMADO'

      ){

        mostrarConfirmacionExistente(
          datos
        );

        return;

      }


      mostrarFormulario(
        datos
      );

    }

  )

  .catch(

    function(error){

      console.error(error);

      mostrarError(
        'No se pudo conectar con el sistema.'
      );

    }

  );

}


// =====================================================
// FORMULARIO
// =====================================================

function mostrarFormulario(

  datos

){

  let campos = '';


  /*
   * Crear los campos
   * según el número de pases.
   */

  for(

    let i = 1;

    i <= Number(datos.personas);

    i++

  ){

    campos += `

      <div class="campo">

        <label>

          NOMBRE DEL INVITADO ${i}

        </label>


        <input

          id="nombre${i}"

          type="text"

          placeholder="Nombre completo"

          autocomplete="name"

        >

      </div>

    `;

  }


  /*
   * Construimos la tarjeta.
   *
   * IMPORTANTE:
   *
   * Aquí NO ponemos directamente
   * el botón dentro del innerHTML.
   *
   * Dejamos una zona vacía
   * llamada zonaBoton.
   */

  document
    .getElementById('contenido')
    .innerHTML = `

      <div class="tarjeta">


        <div class="nombreFamilia">

          ${escapar(datos.invitado)}

        </div>


        <div class="descripcion">

          Nos dará mucho gusto contar contigo.
          Por favor confirma quiénes asistirán.

        </div>


        <div class="cantidad">

          <strong>

            ${Number(datos.personas)}

          </strong>


          <small>

            PASES DISPONIBLES

          </small>

        </div>


        ${campos}


        <div id="zonaBoton"></div>


      </div>

    `;


  // ===================================================
  // CREAR BOTÓN FÍSICAMENTE
  // ===================================================

  const zonaBoton =
    document.getElementById(
      'zonaBoton'
    );


  if(!zonaBoton){

    console.error(
      'No se encontró zonaBoton.'
    );

    return;

  }


  const boton =
    document.createElement(
      'button'
    );


  boton.type =
    'button';


  boton.id =
    'btnConfirmar';


  boton.className =
    'boton';


  boton.textContent =
    'CONFIRMAR ASISTENCIA';


  /*
   * Agregar botón a la tarjeta.
   */

  zonaBoton.appendChild(
    boton
  );


  /*
   * Activar botón.
   */

  boton.addEventListener(

    'click',

    confirmar

  );

}


// =====================================================
// CONFIRMAR ASISTENCIA
// =====================================================

function confirmar(){

  const nombres = [];


  /*
   * Buscar todos los campos.
   */

  for(

    let i = 1;

    i <= 100;

    i++

  ){

    const campo =

      document.getElementById(

        'nombre' + i

      );


    if(!campo){

      break;

    }


    const nombre =

      campo.value.trim();


    /*
     * No permitir nombres vacíos.
     */

    if(!nombre){

      alert(

        'Escribe todos los nombres antes de confirmar.'

      );


      campo.focus();

      return;

    }


    nombres.push(
      nombre
    );

  }


  /*
   * Seguridad.
   */

  if(

    nombres.length === 0

  ){

    alert(
      'Agrega al menos un nombre.'
    );

    return;

  }


  const boton =

    document.getElementById(

      'btnConfirmar'

    );


  /*
   * Desactivar mientras
   * se guarda la información.
   */

  if(boton){

    boton.disabled =
      true;

    boton.textContent =
      'CONFIRMANDO...';

  }


  /*
   * Enviar información
   * a Google Apps Script.
   */

  solicitarAPI(

    'confirmarAsistencia',

    {

      codigo:
        codigo,

      nombres:
        nombres

    }

  )

  .then(

    function(respuesta){


      /*
       * Ya había sido confirmado.
       */

      if(

        respuesta &&

        respuesta.yaConfirmado

      ){

        cargarInvitacion();

        return;

      }


      /*
       * Error.
       */

      if(

        !respuesta ||

        !respuesta.ok

      ){

        alert(

          respuesta?.mensaje ||

          'No se pudo confirmar.'

        );


        if(boton){

          boton.disabled =
            false;

          boton.textContent =
            'CONFIRMAR ASISTENCIA';

        }

        return;

      }


      /*
       * Mostrar pase QR.
       */

      mostrarConfirmacion({

        codigo:
          codigo,

        invitado:
          respuesta.invitado,

        personas:
          respuesta.personas,

        nombres:
          respuesta.nombres

      });

    }

  )

  .catch(

    function(error){

      console.error(error);


      alert(
        'Error al confirmar.'
      );


      if(boton){

        boton.disabled =
          false;

        boton.textContent =
          'CONFIRMAR ASISTENCIA';

      }

    }

  );

}


// =====================================================
// CONFIRMACIÓN EXISTENTE
// =====================================================

function mostrarConfirmacionExistente(

  datos

){

  mostrarConfirmacion({

    codigo:
      datos.codigo,

    invitado:
      datos.invitado,

    personas:
      datos.personas,

    nombres:
      datos.nombres || []

  });

}


// =====================================================
// PANTALLA FINAL CON QR
// =====================================================

function mostrarConfirmacion(

  datos

){

  let lista = '';


  /*
   * Crear lista de nombres.
   */

  (datos.nombres || [])

    .forEach(

      function(nombre){

        lista += `

          <div>

            ${escapar(nombre)}

          </div>

        `;

      }

    );


  /*
   * Crear URL del QR.
   */

  const qrURL =

    'https://quickchart.io/qr?size=500&text='

    +

    encodeURIComponent(

      datos.codigo

    );


  /*
   * Mostrar pase final.
   */

  document

    .getElementById('contenido')

    .innerHTML = `

      <div class="tarjeta">


        <div class="mensaje">


          <div class="icono">

            ✅

          </div>


          <h2>

            ¡Asistencia confirmada!

          </h2>


          <p>

            Gracias por confirmar.

          </p>


        </div>


        <div class="listaNombres">


          <strong>

            INVITADOS CONFIRMADOS

          </strong>


          ${lista}


        </div>


        <h3>

          TU PASE QR

        </h3>


        <img

          class="qr"

          src="${qrURL}"

          alt="QR Pase"

        >


        <p>

          Código:

          <b>

            ${escapar(datos.codigo)}

          </b>

        </p>


        <p>

          Guarda este código para ingresar al evento.

        </p>


      </div>

    `;

}


// =====================================================
// ERROR
// =====================================================

function mostrarError(

  mensaje

){

  document

    .getElementById('contenido')

    .innerHTML = `

      <div class="tarjeta">


        <div class="mensaje error">


          <div class="icono">

            ❌

          </div>


          <h2>

            No pudimos abrir tu invitación

          </h2>


          <p>

            ${escapar(mensaje)}

          </p>


        </div>


      </div>

    `;

}


</script>


</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación de Asistencia</title>
  
  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  
  <!-- Librería para Código QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <!-- Librería para descargar la tarjeta como Imagen -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --bg-color: #fcfbfa;
      --card-bg: #ffffff;
      --primary-color: #2c2825;
      --accent-color: #c9a227;
      --btn-bg: #2c2825;
      --btn-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Montserrat', sans-serif;
      color: var(--primary-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    .hidden {
      display: none !important;
    }

    /* ESTILOS FORMULARIO INICIAL */
    .form-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 35px 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      text-align: center;
      border: 1px solid var(--accent-color);
    }

    .form-title {
      font-family: 'Cinzel', serif;
      font-size: 1.9rem;
      font-weight: 400;
      margin-bottom: 12px;
      color: var(--primary-color);
    }

    .form-subtitle {
      font-size: 0.95rem;
      margin-bottom: 25px;
      color: #4a4a4a;
      line-height: 1.4;
    }

    .inputs-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 25px;
    }

    .inputs-list input {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #e2e2e2;
      border-radius: 12px;
      font-size: 0.9rem;
      text-align: center;
      outline: none;
      color: #333;
      font-family: 'Montserrat', sans-serif;
    }

    .inputs-list input:focus {
      border-color: var(--accent-color);
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      cursor: pointer;
      text-transform: uppercase;
    }

    /* ESTILOS PASE FINAL */
    .pass-card {
      background-color: var(--card-bg);
      border: 1px solid var(--accent-color);
      border-radius: 16px;
      padding: 35px 20px 25px 20px;
      text-align: center;
      color: var(--primary-color);
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .event-type {
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-color);
      margin-bottom: 4px;
    }

    .event-title {
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      letter-spacing: 2px;
      margin-bottom: 12px;
      color: var(--primary-color);
    }

    .divider {
      height: 1px;
      width: 50px;
      background-color: var(--accent-color);
      margin: 12px auto;
    }

    .guest-fullname {
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      font-weight: 700;
      margin: 18px 0 12px 0;
      color: var(--primary-color);
      text-transform: uppercase;
    }

    .passes-title {
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--accent-color);
    }

    .passes-number {
      font-size: 2.2rem;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 12px;
      color: var(--primary-color);
    }

    .qr-container {
      background: #ffffff;
      padding: 15px;
      display: inline-block;
      border-radius: 12px;
      border: 1px solid var(--accent-color);
      margin: 10px 0 15px 0;
    }

    .qr-container img, .qr-container canvas {
      margin: 0 auto;
    }

    .instructions {
      font-size: 0.7rem;
      letter-spacing: 1px;
      margin-bottom: 12px;
      color: var(--primary-color);
      text-transform: uppercase;
    }

    .code-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .code-title {
      font-size: 0.65rem;
      letter-spacing: 1px;
      color: var(--accent-color);
    }

    .code-number {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--primary-color);
    }

    .pass-footer {
      margin-top: 25px;
      font-size: 0.7rem;
      letter-spacing: 1px;
      color: var(--primary-color);
      text-transform: uppercase;
    }

    .btn-download {
      width: 100%;
      padding: 15px;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      cursor: pointer;
      margin-top: 15px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <main class="container">
    
    <!-- PASO 1: Formulario Inicial -->
    <section id="form-step" class="form-card">
      <h1 class="form-title">Confirmar Asistencia</h1>
      <p class="form-subtitle">Hola <strong id="guest-greeting-name">Cargando...</strong>. Tienes <span id="guest-passes-count">0</span> pases autorizados.</p>

      <form id="attendance-form">
        <div id="inputs-container" class="inputs-list"></div>
        <button type="submit" id="btn-submit-form" class="btn-submit">CONFIRMAR ASISTENCIA</button>
      </form>
    </section>

    <!-- PASO 2: Resultado del Pase -->
    <section id="ticket-step" class="hidden">
      <div id="digital-pass-card" class="pass-card">
        <div class="pass-content">
          <p class="event-type" id="display-event-type">PASE DE ACCESO</p>
          <h3 class="event-title" id="display-event-title">NOMBRE DEL EVENTO</h3>
          
          <div class="divider"></div>

          <h1 class="guest-fullname" id="display-guest-name">INVITADO</h1>
          
          <p class="passes-title">PASES</p>
          <div class="passes-number" id="display-confirmed-passes">0</div>

          <div class="qr-container">
            <div id="qrcode"></div>
          </div>

          <p class="instructions">PRESENTA ESTE PASE PARA INGRESAR</p>

          <div class="code-box">
            <span class="code-title">CÓDIGO DE PASE</span>
            <span class="code-number" id="display-pass-code">AN-0000</span>
          </div>
        </div>

        <footer class="pass-footer">
          <p>GRACIAS POR SER PARTE DE ESTE DÍA TAN ESPECIAL</p>
        </footer>
      </div>

      <button type="button" id="download-btn" class="btn-download" onclick="downloadPassImage()">
        Descargar Pase (Imagen)
      </button>
    </section>

  </main>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxd7P-bKlxZAYbd1yHJHxT4sOWRpRuLGIlWNqG4gWt-3dFAmETStniOaZbNlxa2ui2QCA/exec";

    let datosInvitadoGlobal = {
      codigo: "",
      invitado: "",
      autorizadas: 0,
      eventoNombre: "MI EVENTO",
      idEvento: ""
    };

    document.addEventListener("DOMContentLoaded", function () {
      const urlParams = new URLSearchParams(window.location.search);
      const codigoParam = urlParams.get('codigo') || urlParams.get('id');
      const idEventoParam = urlParams.get('evento') || "EV001";

      if (codigoParam) {
        // Petición real al backend mediante doPost
        fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            accion: "obtenerDatosPanel",
            id_evento: idEventoParam
          })
        })
        .then(res => res.json())
        .then(respuesta => {
          if (respuesta.ok && respuesta.invitados) {
            // Buscar al invitado específico en la lista
            const invitado = respuesta.invitados.find(i => String(i.codigo).trim().toUpperCase() === String(codigoParam).trim().toUpperCase());
            
            if (invitado) {
              datosInvitadoGlobal.codigo = invitado.codigo;
              datosInvitadoGlobal.invitado = invitado.invitado;
              datosInvitadoGlobal.autorizadas = invitado.autorizadas;
              datosInvitadoGlobal.idEvento = idEventoParam;

              if (respuesta.evento) {
                datosInvitadoGlobal.eventoNombre = respuesta.evento.nombre;
                aplicarColoresExcel({
                  colorFondo: respuesta.evento.color_fondo || "#fcfbfa",
                  colorTexto: respuesta.evento.color || "#2c2825",
                  colorBoton: respuesta.evento.color_boton || "#2c2825",
                  colorAcento: respuesta.evento.color || "#c9a227"
                });
              }

              cargarDatosEnFormulario(datosInvitadoGlobal);
            } else {
              usarRespaldoURL(urlParams);
            }
          } else {
            usarRespaldoURL(urlParams);
          }
        })
        .catch(() => usarRespaldoURL(urlParams));
      } else {
        usarRespaldoURL(urlParams);
      }
    });

    function usarRespaldoURL(urlParams) {
      datosInvitadoGlobal.invitado = urlParams.get('invitado') || urlParams.get('nombre') || "Invitado";
      datosInvitadoGlobal.autorizadas = parseInt(urlParams.get('pases') || urlParams.get('personas')) || 1;
      datosInvitadoGlobal.codigo = urlParams.get('codigo') || urlParams.get('id') || "AN-0000";
      datosInvitadoGlobal.eventoNombre = urlParams.get('evento') || "MI EVENTO";

      cargarDatosEnFormulario(datosInvitadoGlobal);
    }

    function cargarDatosEnFormulario(datos) {
      document.getElementById("guest-greeting-name").innerText = datos.invitado;
      document.getElementById("guest-passes-count").innerText = datos.autorizadas;

      const container = document.getElementById("inputs-container");
      container.innerHTML = "";
      const totalPases = parseInt(datos.autorizadas) || 1;

      for (let i = 1; i <= totalPases; i++) {
        const input = document.createElement("input");
        input.type = "text";
        input.placeholder = `Nombre Asistente ${i}`;
        input.className = "input-asistente";
        if (i === 1 && datos.invitado && !datos.invitado.toLowerCase().includes("familia")) {
          input.value = datos.invitado;
        }
        container.appendChild(input);
      }
    }

    function aplicarColoresExcel(colores) {
      const root = document.documentElement;
      if (colores.colorFondo) root.style.setProperty('--bg-color', colores.colorFondo);
      if (colores.colorTexto) root.style.setProperty('--primary-color', colores.colorTexto);
      if (colores.colorBoton) root.style.setProperty('--btn-bg', colores.colorBoton);
      if (colores.colorAcento) root.style.setProperty('--accent-color', colores.colorAcento);
    }

    document.getElementById("attendance-form").addEventListener("submit", function (e) {
      e.preventDefault();

      const btnSubmit = document.getElementById("btn-submit-form");
      btnSubmit.innerText = "GUARDANDO...";
      btnSubmit.disabled = true;

      const inputs = document.querySelectorAll(".input-asistente");
      const asistentesConfirmados = [];
      inputs.forEach(input => {
        if (input.value.trim() !== "") asistentesConfirmados.push(input.value.trim());
      });

      const totalConfirmados = asistentesConfirmados.length > 0 ? asistentesConfirmados.length : datosInvitadoGlobal.autorizadas;

      // Guardar en la hoja vía Apps Script (Acción RUTA 3: confirmarAsistencia)
      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          accion: "confirmarAsistencia",
          id_evento: datosInvitadoGlobal.idEvento,
          codigo: datosInvitadoGlobal.codigo,
          nombres: asistentesConfirmados
        })
      }).finally(() => {
        mostrarPaseConfirmado(totalConfirmados);
      });
    });

    function mostrarPaseConfirmado(pasesConfirmados) {
      document.getElementById("display-event-type").innerText = "PASE DE ACCESO";
      document.getElementById("display-event-title").innerText = datosInvitadoGlobal.eventoNombre || "MI EVENTO";
      document.getElementById("display-guest-name").innerText = datosInvitadoGlobal.invitado || "INVITADO";
      document.getElementById("display-confirmed-passes").innerText = pasesConfirmados;
      document.getElementById("display-pass-code").innerText = datosInvitadoGlobal.codigo || "AN-0000";

      document.getElementById("form-step").classList.add("hidden");
      document.getElementById("ticket-step").classList.remove("hidden");

      generarQR(datosInvitadoGlobal.codigo || "AN-0000");
    }

    function generarQR(codigo) {
      const qrContainer = document.getElementById("qrcode");
      qrContainer.innerHTML = "";

      const colorTexto = getComputedStyle(document.documentElement).getPropertyValue('--primary-color').trim() || "#000000";

      new QRCode(qrContainer, {
        text: codigo,
        width: 160,
        height: 160,
        colorDark: colorTexto,
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    function downloadPassImage() {
      const passElement = document.getElementById("digital-pass-card");

      html2canvas(passElement, {
        scale: 3,
        useCORS: true,
        backgroundColor: null
      }).then(canvas => {
        const guestName = document.getElementById("display-guest-name").innerText || "Pase";
        const link = document.createElement("a");
        link.download = `Pase_${guestName.replace(/\s+/g, '_')}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    }
  </script>
</body>
</html>

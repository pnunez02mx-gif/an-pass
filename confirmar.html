<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación de Asistencia - AN en Digital</title>
  
  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  
  <!-- Librería para Código QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <!-- Librería para descargar la tarjeta como Imagen -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* Variables de color predeterminadas (se actualizan automáticamente desde el Excel) */
    :root {
      --bg-color: #f7f4ee;
      --card-bg: #f3ece0;
      --primary-color: #5c4a3e;
      --accent-color: #8c7355;
      --text-dark: #2b2321;
      --btn-bg: #332821;
      --btn-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Montserrat', sans-serif;
      color: var(--primary-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    .hidden {
      display: none !important;
    }

    /* Estilos del Formulario Inicial */
    .form-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 25px 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
      text-align: center;
    }

    .form-title {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: var(--primary-color);
    }

    .form-subtitle {
      font-size: 0.95rem;
      margin-bottom: 20px;
      color: #555;
    }

    .inputs-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .inputs-list input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.9rem;
      text-align: center;
      outline: none;
    }

    /* Tarjeta Digital del Pase */
    .pass-card {
      background-color: var(--card-bg);
      border: 1px solid var(--accent-color);
      border-radius: 12px;
      padding: 30px 20px 20px 20px;
      text-align: center;
      color: var(--primary-color);
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      letter-spacing: 2px;
      font-weight: 400;
      color: var(--primary-color);
      margin: 0;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      letter-spacing: 3px;
      margin-top: 2px;
      color: var(--accent-color);
      font-weight: 600;
    }

    .pass-content {
      margin-top: 20px;
    }

    .event-type {
      font-size: 0.8rem;
      letter-spacing: 2px;
      color: var(--accent-color);
    }

    .event-title {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      letter-spacing: 2px;
      margin: 5px 0;
      color: var(--primary-color);
    }

    .divider {
      height: 1px;
      width: 60px;
      background-color: var(--accent-color);
      margin: 12px auto;
    }

    .guest-fullname {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      font-weight: 700;
      margin: 15px 0 10px 0;
      color: var(--text-dark);
    }

    .passes-title {
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--accent-color);
    }

    .passes-number {
      font-size: 2.2rem;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 10px;
      color: var(--text-dark);
    }

    .qr-container {
      background: #ffffff;
      padding: 15px;
      display: inline-block;
      border-radius: 10px;
      border: 1px solid var(--accent-color);
      margin: 10px 0 15px 0;
    }

    .qr-container img, .qr-container canvas {
      margin: 0 auto;
    }

    .instructions {
      font-size: 0.7rem;
      letter-spacing: 1px;
      margin-bottom: 15px;
      color: var(--primary-color);
    }

    .code-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .code-title {
      font-size: 0.65rem;
      letter-spacing: 1px;
      color: var(--accent-color);
    }

    .code-number {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--text-dark);
    }

    .pass-footer {
      margin-top: 25px;
      font-size: 0.7rem;
      letter-spacing: 1px;
      color: var(--primary-color);
    }

    .heart-symbol {
      font-size: 1rem;
      margin-top: 5px;
      color: var(--accent-color);
    }

    /* Botones */
    .btn-submit, .btn-download {
      width: 100%;
      padding: 14px;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: 8px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <main class="container">
    
    <!-- PASO 1: Formulario de Confirmación -->
    <section id="form-step" class="form-card">
      <h1 class="form-title">Confirmar Asistencia</h1>
      <p class="form-subtitle">Hola <strong id="guest-greeting-name">Invitado</strong>. Tienes <span id="guest-passes-count">0</span> pases autorizados.</p>

      <form id="attendance-form">
        <div id="inputs-container" class="inputs-list">
          <!-- Inputs generados dinámicamente -->
        </div>

        <button type="submit" class="btn-submit">CONFIRMAR ASISTENCIA</button>
      </form>
    </section>

    <!-- PASO 2: Confirmación y Tarjeta del Pase -->
    <section id="ticket-step" class="hidden">
      
      <!-- Contenedor que se descargará como IMAGEN -->
      <div id="digital-pass-card" class="pass-card">
        
        <header class="pass-header">
          <h2 class="brand-title">AN en Digital</h2>
          <p class="brand-subtitle">PASE DE ACCESO</p>
        </header>

        <div class="pass-content">
          <p class="event-type" id="display-event-type">EVENTO</p>
          <h3 class="event-title" id="display-event-title">NOMBRE DEL EVENTO</h3>
          
          <div class="divider"></div>

          <h1 class="guest-fullname" id="display-guest-name">NOMBRE DEL INVITADO</h1>
          
          <p class="passes-title">PASES</p>
          <div class="passes-number" id="display-confirmed-passes">0</div>

          <!-- Código QR -->
          <div class="qr-container">
            <div id="qrcode"></div>
          </div>

          <p class="instructions">PRESENTA ESTE PASE PARA INGRESAR</p>

          <div class="code-box">
            <span class="code-title">CÓDIGO DE PASE</span>
            <span class="code-number" id="display-pass-code">AN-000-0000</span>
          </div>
        </div>

        <footer class="pass-footer">
          <p>GRACIAS POR SER PARTE DE ESTE DÍA TAN ESPECIAL</p>
          <div class="heart-symbol">♡</div>
        </footer>

      </div>

      <!-- Botón de Descargar en Imagen -->
      <button type="button" id="download-btn" class="btn-download" onclick="downloadPassImage()">
        Descargar Pase (Imagen)
      </button>

    </section>

  </main>

  <script>
    // Configura los colores leyendo las variables de tu Excel
    function aplicarColoresExcel(datosExcel) {
      const root = document.documentElement;
      if (datosExcel.colorFondo) root.style.setProperty('--bg-color', datosExcel.colorFondo);
      if (datosExcel.colorTarjeta) root.style.setProperty('--card-bg', datosExcel.colorTarjeta);
      if (datosExcel.colorTexto) {
        root.style.setProperty('--primary-color', datosExcel.colorTexto);
        root.style.setProperty('--text-dark', datosExcel.colorTexto);
      }
      if (datosExcel.colorAcento) root.style.setProperty('--accent-color', datosExcel.colorAcento);
      if (datosExcel.colorBoton) root.style.setProperty('--btn-bg', datosExcel.colorBoton);
    }

    // Ejemplo de llamada cuando obtengas los datos del backend (google.script.run):
    /*
      google.script.run.withSuccessHandler(function(datos) {
        aplicarColoresExcel(datos);
        // ...resto de tu lógica de carga
      }).getDatosEvento();
    */

    // Manejador del Formulario
    document.getElementById("attendance-form").addEventListener("submit", function (e) {
      e.preventDefault();

      document.getElementById("form-step").classList.add("hidden");
      document.getElementById("ticket-step").classList.remove("hidden");

      // Generar el código QR
      const codigoPase = document.getElementById("display-pass-code").innerText;
      generarQR(codigoPase);
    });

    // Generar QR
    function generarQR(codigo) {
      const qrContainer = document.getElementById("qrcode");
      qrContainer.innerHTML = "";

      new QRCode(qrContainer, {
        text: codigo,
        width: 150,
        height: 150,
        colorDark: getComputedStyle(document.documentElement).getPropertyValue('--primary-color').trim() || "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    // Función para descargar la tarjeta del pase completa como PNG
    function downloadPassImage() {
      const passElement = document.getElementById("digital-pass-card");

      html2canvas(passElement, {
        scale: 3,
        useCORS: true,
        backgroundColor: null
      }).then(canvas => {
        const guestName = document.getElementById("display-guest-name").innerText || "Pase";
        const link = document.createElement("a");
        link.download = `Pase_${guestName.replace(/\s+/g, '_')}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    }
  </script>
</body>
</html>

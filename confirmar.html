<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación - AN PASS</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
  <style>
    body { background: #fcfbfa; font-family: 'Montserrat', sans-serif; display: flex; justify-content: center; padding: 20px; }
    .card { background: white; width: 100%; max-width: 400px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 28px; margin-bottom: 20px; }
    .input-field { width: 100%; padding: 12px; border: 1px solid #eae6df; border-radius: 10px; margin-bottom: 10px; text-align: center; }
    .btn { width: 100%; padding: 12px; background: #2c2825; color: white; border: none; border-radius: 10px; cursor: pointer; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
    .hidden { display: none; }
    #secFormulario, #secPase { margin-top: 20px; }
    .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #2c2825; border-radius: 50%; width: 25px; height: 25px; animation: spin 1s linear infinite; margin: 10px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="card">
  <h1>Confirmar Asistencia</h1>
  
  <!-- BUSCADOR -->
  <div id="secBuscador">
    <p style="font-size: 13px; margin-bottom: 15px;">Escribe tu nombre tal como aparece en la invitación o tu teléfono para continuar:</p>
    <input type="text" id="inputBusqueda" class="input-field" placeholder="Nombre o Teléfono">
    <button class="btn" onclick="buscarInvitado()">Buscar mi invitación</button>
  </div>

  <div id="loader" class="spinner" style="display:none;"></div>

  <!-- FORMULARIO -->
  <div id="secFormulario" class="hidden">
    <p>¡Hola <span id="lblInvitado" style="font-weight:600;"></span>! Tienes <span id="lblPases"></span> pases.</p>
    <div id="listaInputs" style="margin: 15px 0; text-align: left;"></div>
    <button class="btn" id="btnConfirmar" onclick="guardarConfirmacion()">Confirmar</button>
  </div>

  <!-- RESULTADO -->
  <div id="secPase" class="hidden">
    <p style="color:green; font-weight:600;">✅ ¡Confirmado!</p>
    <canvas id="qrCanvas"></canvas>
    <p style="font-size:12px; margin-top:10px;">Muestra este código en la entrada.</p>
  </div>
</div>

<script>
  const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbxd7P-bKlxZAYbd1yHJHxT4sOWRpRuLGIlWNqG4gWt-3dFAmETStniOaZbNlxa2ui2QCA/exec';
  let paseEncontrado = null;

  function buscarInvitado() {
    const query = document.getElementById('inputBusqueda').value.toLowerCase().trim();
    if (!query) return alert("Escribe algo.");
    
    document.getElementById('loader').style.display = 'block';
    
    fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      body: JSON.stringify({ accion: 'obtenerDatosPanel', id_evento: 'EV001' })
    })
    .then(r => r.json())
    .then(res => {
      document.getElementById('loader').style.display = 'none';
      const inv = res.invitados.find(i => 
        (i.invitado && i.invitado.toLowerCase().includes(query)) || 
        (i.telefono && i.telefono.toString().includes(query))
      );
      
      if (inv) {
        paseEncontrado = inv;
        document.getElementById('secBuscador').style.display = 'none';
        document.getElementById('secFormulario').style.display = 'block';
        document.getElementById('lblInvitado').textContent = inv.invitado;
        document.getElementById('lblPases').textContent = inv.autorizadas;
        
        let html = '';
        for(let i=1; i<=inv.autorizadas; i++) {
          html += `<input type="text" class="input-field input-nombre" placeholder="Nombre Asistente ${i}">`;
        }
        document.getElementById('listaInputs').innerHTML = html;
      } else {
        alert("No encontrado. Intenta con tu nombre o teléfono.");
      }
    });
  }

  function guardarConfirmacion() {
    const inputs = document.querySelectorAll('.input-nombre');
    const nombres = Array.from(inputs).map(i => i.value).filter(v => v !== "");
    
    fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      body: JSON.stringify({ 
        accion: 'confirmarAsistencia', 
        codigo: paseEncontrado.codigo, 
        nombres: nombres 
      })
    })
    .then(r => r.json())
    .then(res => {
      document.getElementById('secFormulario').style.display = 'none';
      document.getElementById('secPase').style.display = 'block';
      new QRious({ element: document.getElementById('qrCanvas'), value: "https://pnunez02mx-gif.github.io/an-pass/?evento=EV001&codigo=" + paseEncontrado.codigo, size: 150 });
    });
  }
</script>
</body>
</html>

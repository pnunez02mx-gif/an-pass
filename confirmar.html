<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>AN PASS - Confirmación</title>


<style>

/* =====================================================
   VARIABLES DEL EVENTO
   ===================================================== */

:root{

  --color-principal:#292522;

  --color-fondo:#f7f3ed;

  --color-boton:#292522;

  --color-tarjeta:#ffffff;

  --color-borde:#e5ddd2;

  --color-secundario:#706860;

}


/* =====================================================
   GENERAL
   ===================================================== */

*{
  box-sizing:border-box;
}

html,
body{

  margin:0;

  padding:0;

  min-height:100%;

}

body{

  background:var(--color-fondo);

  color:var(--color-principal);

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  -webkit-font-smoothing:antialiased;

  transition:
    background .3s ease,
    color .3s ease;

}


/* =====================================================
   CONTENEDOR
   ===================================================== */

.app{

  width:100%;

  max-width:500px;

  margin:0 auto;

  padding:
    28px
    18px
    60px;

}


/* =====================================================
   ENCABEZADO
   ===================================================== */

header{

  text-align:center;

  margin-bottom:24px;

}

.logo{

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:32px;

  line-height:.8;

  letter-spacing:3px;

  color:var(--color-principal);

}

.logo span{

  font-size:20px;

  letter-spacing:6px;

}

.subtitulo{

  margin-top:15px;

  font-size:9px;

  letter-spacing:3px;

  color:var(--color-secundario);

}


/* =====================================================
   IMAGEN DEL EVENTO
   ===================================================== */

.imagenEvento{

  width:100%;

  max-height:230px;

  object-fit:cover;

  border-radius:18px;

  display:block;

  margin:
    0
    0
    20px;

}


/* =====================================================
   TARJETA
   ===================================================== */

.tarjeta{

  width:100%;

  background:var(--color-tarjeta);

  border:
    1px solid
    var(--color-borde);

  border-radius:22px;

  padding:
    25px
    18px
    22px;

  box-shadow:
    0 5px 18px
    rgba(70,60,50,.07);

  text-align:center;

}


/* =====================================================
   NOMBRE
   ===================================================== */

.nombreFamilia{

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:27px;

  line-height:1.2;

  margin:
    5px 0 10px;

  color:var(--color-principal);

}


/* =====================================================
   DESCRIPCIÓN
   ===================================================== */

.descripcion{

  color:var(--color-secundario);

  font-size:13px;

  line-height:1.5;

}


/* =====================================================
   PASES
   ===================================================== */

.cantidad{

  background:var(--color-fondo);

  border-radius:15px;

  padding:18px;

  margin:20px 0;

}

.cantidad strong{

  display:block;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:38px;

  line-height:1;

  color:var(--color-principal);

}

.cantidad small{

  display:block;

  margin-top:6px;

  font-size:9px;

  font-weight:bold;

  letter-spacing:1px;

  color:var(--color-principal);

}


/* =====================================================
   CAMPOS
   ===================================================== */

.campo{

  width:100%;

  text-align:left;

  margin-bottom:14px;

}

.campo label{

  display:block;

  font-size:9px;

  font-weight:bold;

  margin-bottom:6px;

  color:var(--color-principal);

}

.campo input{

  display:block;

  width:100%;

  height:46px;

  padding:
    12px
    13px;

  border:
    1px solid
    var(--color-borde);

  border-radius:12px;

  background:#ffffff;

  color:var(--color-principal);

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size:14px;

  outline:none;

  appearance:none;

  -webkit-appearance:none;

}

.campo input:focus{

  border-color:
    var(--color-principal);

  box-shadow:
    0 0 0 3px
    rgba(0,0,0,.08);

}

.campo input::placeholder{

  color:#aaa29a;

}


/* =====================================================
   BOTÓN
   ===================================================== */

#zonaBoton{

  width:100%;

  margin-top:22px;

}

button.boton{

  display:block !important;

  width:100% !important;

  min-height:52px;

  padding:
    15px
    18px;

  border:none !important;

  border-radius:13px;

  background:
    var(--color-boton) !important;

  color:#ffffff !important;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size:14px;

  font-weight:bold;

  letter-spacing:.4px;

  cursor:pointer;

  appearance:none;

  -webkit-appearance:none;

  transition:
    transform .15s,
    opacity .15s;

}

button.boton:active{

  transform:scale(.98);

}

button.boton:disabled{

  opacity:.6 !important;

  cursor:not-allowed;

}


/* =====================================================
   MENSAJES
   ===================================================== */

.mensaje{

  text-align:center;

  padding:15px;

}

.icono{

  font-size:52px;

  line-height:1;

  margin-bottom:10px;

}

.mensaje h2{

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  color:var(--color-principal);

  margin:
    10px 0;

}

.mensaje p{

  color:var(--color-secundario);

  font-size:13px;

  line-height:1.5;

}


/* =====================================================
   LISTA DE CONFIRMADOS
   ===================================================== */

.listaNombres{

  background:var(--color-fondo);

  border-radius:15px;

  padding:15px;

  margin-top:20px;

  text-align:left;

}

.listaNombres strong{

  display:block;

  font-size:10px;

  letter-spacing:1px;

  margin-bottom:10px;

  color:var(--color-principal);

}

.listaNombres div{

  padding:7px 0;

  border-bottom:
    1px solid
    var(--color-borde);

  font-size:13px;

  color:var(--color-principal);

}

.listaNombres div:last-child{

  border-bottom:none;

}


/* =====================================================
   QR
   ===================================================== */

h3{

  margin:
    25px 0 5px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:18px;

  font-weight:normal;

  color:var(--color-principal);

}

.qr{

  display:block;

  width:220px;

  height:220px;

  margin:
    15px auto;

}


/* =====================================================
   ERROR
   ===================================================== */

.error{

  color:#8b443b;

}

.error h2{

  color:#8b443b;

}


/* =====================================================
   CELULARES
   ===================================================== */

@media(max-width:380px){

  .app{

    padding:
      22px
      14px
      45px;

  }

  .tarjeta{

    padding:
      22px
      15px
      20px;

  }

  .nombreFamilia{

    font-size:24px;

  }

  .cantidad strong{

    font-size:34px;

  }

  .qr{

    width:200px;

    height:200px;

  }

}

</style>

</head>


<body>


<div class="app">


<header>

  <div class="logo">

    AN<br>

    <span>PASS</span>

  </div>


  <div class="subtitulo">

    CONFIRMACIÓN DE ASISTENCIA

  </div>

</header>


<div id="contenido">

  <div class="tarjeta">

    <div class="mensaje">

      Cargando invitación...

    </div>

  </div>

</div>


</div>



<script>


// =====================================================
// URL DEL APPS SCRIPT
// =====================================================

const URL_APPS_SCRIPT =
'https://script.google.com/macros/s/AKfycbxd7P-bKlxZAYbd1yHJHxT4sOWRpRuLGIlWNqG4gWt-3dFAmETStniOaZbNlxa2ui2QCA/exec';


// =====================================================
// DATOS DE LA URL
// =====================================================

const parametros =
new URLSearchParams(
  window.location.search
);


const codigo =
String(
  parametros.get('codigo') || ''
)
.trim();


const evento =
String(
  parametros.get('evento') || ''
)
.trim()
.toUpperCase();


// =====================================================
// CONFIGURACIÓN VISUAL DEL EVENTO
// =====================================================

let configuracionEvento = {

  color:
    '#292522',

  color_fondo:
    '#f7f3ed',

  color_boton:
    '#292522',

  imagen:
    ''

};


// =====================================================
// APLICAR CONFIGURACIÓN VISUAL
// =====================================================

function aplicarConfiguracionEvento(
  datos
){

  /*
   * Aceptamos diferentes nombres
   * para que sea compatible con
   * la estructura que ya manejamos.
   */

  const eventoDatos =
    datos.evento || {};


  const color =

    eventoDatos.color ||

    eventoDatos.COLOR ||

    datos.color ||

    datos.COLOR ||

    '#292522';


  const colorFondo =

    eventoDatos.color_fondo ||

    eventoDatos.COLOR_FONDO ||

    eventoDatos.colorFondo ||

    datos.color_fondo ||

    datos.COLOR_FONDO ||

    datos.colorFondo ||

    '#f7f3ed';


  const colorBoton =

    eventoDatos.color_boton ||

    eventoDatos.COLOR_BOTON ||

    eventoDatos.colorBoton ||

    datos.color_boton ||

    datos.COLOR_BOTON ||

    datos.colorBoton ||

    color;


  const imagen =

    eventoDatos.imagen ||

    eventoDatos.IMAGEN ||

    datos.imagen ||

    datos.IMAGEN ||

    '';


  configuracionEvento.color =
    color;

  configuracionEvento.color_fondo =
    colorFondo;

  configuracionEvento.color_boton =
    colorBoton;

  configuracionEvento.imagen =
    imagen;


  /*
   * Aplicar colores mediante
   * variables CSS.
   */

  document.documentElement
    .style
    .setProperty(
      '--color-principal',
      color
    );


  document.documentElement
    .style
    .setProperty(
      '--color-fondo',
      colorFondo
    );


  document.documentElement
    .style
    .setProperty(
      '--color-boton',
      colorBoton
    );


  /*
   * Aplicar imagen si existe.
   */

  if(imagen){

    mostrarImagenEvento(
      imagen
    );

  }

}


// =====================================================
// MOSTRAR IMAGEN
// =====================================================

function mostrarImagenEvento(
  imagen
){

  if(!imagen){

    return;

  }


  /*
   * La imagen se coloca
   * antes de la tarjeta.
   */

  const contenedor =
    document.getElementById(
      'contenido'
    );


  if(!contenedor){

    return;

  }


  /*
   * Evitar duplicados.
   */

  const existente =
    document.getElementById(
      'imagenEvento'
    );


  if(existente){

    existente.src =
      imagen;

    return;

  }


  const imagenElemento =
    document.createElement(
      'img'
    );


  imagenElemento.id =
    'imagenEvento';

  imagenElemento.className =
    'imagenEvento';

  imagenElemento.src =
    imagen;

  imagenElemento.alt =
    'Imagen del evento';


  contenedor.parentNode.insertBefore(

    imagenElemento,

    contenedor

  );

}


// =====================================================
// API
// =====================================================

function solicitarAPI(

  accion,

  datos={}

){

  datos.accion =
    accion;

  datos.idEvento =
    evento;


  return fetch(

    URL_APPS_SCRIPT,

    {

      method:'POST',

      mode:'cors',

      headers:{

        'Content-Type':
          'text/plain;charset=utf-8'

      },

      body:
        JSON.stringify(datos)

    }

  )

  .then(

    respuesta =>
      respuesta.json()

  );

}


// =====================================================
// ESCAPAR TEXTO
// =====================================================

function escapar(
  texto
){

  if(

    texto === null ||

    texto === undefined

  ){

    return '';

  }


  return String(texto)

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


// =====================================================
// INICIO
// =====================================================

window.onload =
function(){

  if(

    !codigo ||

    !evento

  ){

    mostrarError(
      'Código o evento incorrecto.'
    );

    return;

  }


  cargarInvitacion();

};


// =====================================================
// CARGAR INVITACIÓN
// =====================================================

function cargarInvitacion(){

  solicitarAPI(

    'obtenerDatosConfirmacion',

    {

      codigo:
        codigo

    }

  )

  .then(

    function(datos){

      if(

        !datos ||

        !datos.ok

      ){

        mostrarError(

          datos?.mensaje ||

          'La invitación no existe.'

        );

        return;

      }


      /*
       * PRIMERO aplicamos
       * el diseño del evento.
       */

      aplicarConfiguracionEvento(
        datos
      );


      /*
       * Si ya confirmó,
       * mostrar su pase.
       */

      if(

        String(
          datos.confirmacion || ''
        )
        .trim()
        .toUpperCase()

        ===

        'CONFIRMADO'

      ){

        mostrarConfirmacionExistente(
          datos
        );

        return;

      }


      mostrarFormulario(
        datos
      );

    }

  )

  .catch(

    function(error){

      console.error(error);

      mostrarError(
        'No se pudo conectar con el sistema.'
      );

    }

  );

}


// =====================================================
// FORMULARIO
// =====================================================

function mostrarFormulario(

  datos

){

  let campos =
    '';


  /*
   * Crear un campo
   * por cada pase.
   */

  for(

    let i = 1;

    i <= Number(
      datos.personas
    );

    i++

  ){

    campos += `

      <div class="campo">

        <label>

          NOMBRE DEL INVITADO ${i}

        </label>


        <input

          id="nombre${i}"

          type="text"

          placeholder="Nombre completo"

          autocomplete="name"

        >

      </div>

    `;

  }


  /*
   * Construir tarjeta.
   */

  document
    .getElementById('contenido')
    .innerHTML = `

      <div class="tarjeta">


        <div class="nombreFamilia">

          ${escapar(
            datos.invitado
          )}

        </div>


        <div class="descripcion">

          Nos dará mucho gusto contar contigo.
          Por favor confirma quiénes asistirán.

        </div>


        <div class="cantidad">

          <strong>

            ${Number(
              datos.personas
            )}

          </strong>


          <small>

            PASES DISPONIBLES

          </small>

        </div>


        ${campos}


        <div id="zonaBoton"></div>


      </div>

    `;


  /*
   * Crear botón después
   * de crear los campos.
   */

  const zonaBoton =
    document.getElementById(
      'zonaBoton'
    );


  if(!zonaBoton){

    return;

  }


  const boton =
    document.createElement(
      'button'
    );


  boton.type =
    'button';

  boton.id =
    'btnConfirmar';

  boton.className =
    'boton';

  boton.textContent =
    'CONFIRMAR ASISTENCIA';


  zonaBoton.appendChild(
    boton
  );


  boton.addEventListener(
    'click',
    confirmar
  );

}


// =====================================================
// CONFIRMAR
// =====================================================

function confirmar(){

  const nombres =
    [];


  for(

    let i = 1;

    i <= 100;

    i++

  ){

    const campo =
      document.getElementById(
        'nombre' + i
      );


    if(!campo){

      break;

    }


    const nombre =
      campo.value.trim();


    if(!nombre){

      alert(
        'Escribe todos los nombres antes de confirmar.'
      );


      campo.focus();

      return;

    }


    nombres.push(
      nombre
    );

  }


  if(
    nombres.length === 0
  ){

    alert(
      'Agrega al menos un nombre.'
    );

    return;

  }


  const boton =
    document.getElementById(
      'btnConfirmar'
    );


  if(boton){

    boton.disabled =
      true;

    boton.textContent =
      'CONFIRMANDO...';

  }


  solicitarAPI(

    'confirmarAsistencia',

    {

      codigo:
        codigo,

      nombres:
        nombres

    }

  )

  .then(

    function(respuesta){

      /*
       * Ya confirmado.
       */

      if(

        respuesta &&

        respuesta.yaConfirmado

      ){

        cargarInvitacion();

        return;

      }


      /*
       * Error.
       */

      if(

        !respuesta ||

        !respuesta.ok

      ){

        alert(

          respuesta?.mensaje ||

          'No se pudo confirmar.'

        );


        if(boton){

          boton.disabled =
            false;

          boton.textContent =
            'CONFIRMAR ASISTENCIA';

        }

        return;

      }


      /*
       * Confirmación correcta.
       */

      mostrarConfirmacion({

        codigo:
          codigo,

        invitado:
          respuesta.invitado,

        personas:
          respuesta.personas,

        nombres:
          respuesta.nombres

      });

    }

  )

  .catch(

    function(error){

      console.error(error);


      alert(
        'Error al confirmar.'
      );


      if(boton){

        boton.disabled =
          false;

        boton.textContent =
          'CONFIRMAR ASISTENCIA';

      }

    }

  );

}


// =====================================================
// CONFIRMACIÓN EXISTENTE
// =====================================================

function mostrarConfirmacionExistente(

  datos

){

  mostrarConfirmacion({

    codigo:
      datos.codigo,

    invitado:
      datos.invitado,

    personas:
      datos.personas,

    nombres:
      datos.nombres || []

  });

}


// =====================================================
// MOSTRAR CONFIRMACIÓN
// =====================================================

function mostrarConfirmacion(

  datos

){

  let lista =
    '';


  (datos.nombres || [])

    .forEach(

      function(nombre){

        lista += `

          <div>

            ${escapar(nombre)}

          </div>

        `;

      }

    );


  /*
   * QR.
   */

  const qrURL =

    'https://quickchart.io/qr?size=500&text='

    +

    encodeURIComponent(
      datos.codigo
    );


  document
    .getElementById('contenido')
    .innerHTML = `

      <div class="tarjeta">


        <div class="mensaje">


          <div class="icono">

            ✅

          </div>


          <h2>

            ¡Asistencia confirmada!

          </h2>


          <p>

            Gracias por confirmar.

          </p>


        </div>


        <div class="listaNombres">


          <strong>

            INVITADOS CONFIRMADOS

          </strong>


          ${lista}


        </div>


        <h3>

          TU PASE QR

        </h3>


        <img

          class="qr"

          src="${qrURL}"

          alt="QR Pase"

        >


        <p>

          Código:

          <b>

            ${escapar(
              datos.codigo
            )}

          </b>

        </p>


        <p>

          Guarda este código para ingresar al evento.

        </p>


      </div>

    `;

}


// =====================================================
// ERROR
// =====================================================

function mostrarError(

  mensaje

){

  document
    .getElementById('contenido')
    .innerHTML = `

      <div class="tarjeta">


        <div class="mensaje error">


          <div class="icono">

            ❌

          </div>


          <h2>

            No pudimos abrir tu invitación

          </h2>


          <p>

            ${escapar(mensaje)}

          </p>


        </div>


      </div>

    `;

}


</script>

</body>

</html>

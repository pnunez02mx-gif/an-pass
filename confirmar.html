<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación de Asistencia</title>
  
  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  
  <!-- Librería para Código QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <!-- Librería para descargar la tarjeta como Imagen -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* Variables de color predeterminado (se sobreescriben desde Apps Script / Excel) */
    :root {
      --bg-color: #f7f4ee;
      --card-bg: #f3ece0;
      --primary-color: #3e332e;
      --accent-color: #8c7355;
      --text-dark: #2b2321;
      --btn-bg: #332821;
      --btn-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Montserrat', sans-serif;
      color: var(--primary-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    .hidden {
      display: none !important;
    }

    /* 1. ESTILOS DEL FORMULARIO */
    .form-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 35px 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
      text-align: center;
    }

    .form-title {
      font-family: 'Cinzel', serif;
      font-size: 1.9rem;
      font-weight: 400;
      margin-bottom: 12px;
      color: var(--primary-color);
    }

    .form-subtitle {
      font-size: 0.95rem;
      margin-bottom: 25px;
      color: #4a4a4a;
      line-height: 1.4;
    }

    .inputs-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 25px;
    }

    .inputs-list input {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #e2e2e2;
      border-radius: 12px;
      font-size: 0.9rem;
      text-align: center;
      outline: none;
      color: #333;
      font-family: 'Montserrat', sans-serif;
      transition: border-color 0.2s ease;
    }

    .inputs-list input:focus {
      border-color: var(--accent-color);
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      cursor: pointer;
      text-transform: uppercase;
    }

    /* 2. ESTILOS DE LA TARJETA DEL PASE */
    .pass-card {
      background-color: var(--card-bg);
      border: 1px solid var(--accent-color);
      border-radius: 16px;
      padding: 35px 20px 25px 20px;
      text-align: center;
      color: var(--primary-color);
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .event-type {
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-color);
      margin-bottom: 4px;
    }

    .event-title {
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      letter-spacing: 2px;
      margin-bottom: 12px;
      color: var(--primary-color);
    }

    .divider {
      height: 1px;
      width: 50px;
      background-color: var(--accent-color);
      margin: 12px auto;
    }

    .guest-fullname {
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      font-weight: 700;
      margin: 18px 0 12px 0;
      color: var(--text-dark);
      text-transform: uppercase;
    }

    .passes-title {
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--accent-color);
    }

    .passes-number {
      font-size: 2.2rem;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 12px;
      color: var(--text-dark);
    }

    .qr-container {
      background: #ffffff;
      padding: 15px;
      display: inline-block;
      border-radius: 12px;
      border: 1px solid var(--accent-color);
      margin: 10px 0 15px 0;
    }

    .qr-container img, .qr-container canvas {
      margin: 0 auto;
    }

    .instructions {
      font-size: 0.7rem;
      letter-spacing: 1px;
      margin-bottom: 12px;
      color: var(--primary-color);
      text-transform: uppercase;
    }

    .code-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .code-title {
      font-size: 0.65rem;
      letter-spacing: 1px;
      color: var(--accent-color);
    }

    .code-number {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--text-dark);
    }

    .pass-footer {
      margin-top: 25px;
      font-size: 0.7rem;
      letter-spacing: 1px;
      color: var(--primary-color);
      text-transform: uppercase;
    }

    .btn-download {
      width: 100%;
      padding: 15px;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      cursor: pointer;
      margin-top: 15px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <main class="container">
    
    <!-- PASO 1: Formulario Inicial -->
    <section id="form-step" class="form-card">
      <h1 class="form-title">Confirmar Asistencia</h1>
      <p class="form-subtitle">Hola <strong id="guest-greeting-name">Cargando...</strong>. Tienes <span id="guest-passes-count">0</span> pases autorizados.</p>

      <form id="attendance-form">
        <div id="inputs-container" class="inputs-list">
          <!-- Inputs generados dinámicamente desde Apps Script -->
        </div>

        <button type="submit" id="btn-submit-form" class="btn-submit">CONFIRMAR ASISTENCIA</button>
      </form>
    </section>

    <!-- PASO 2: Resultado de la Confirmación -->
    <section id="ticket-step" class="hidden">
      
      <!-- Pase digital personalizado -->
      <div id="digital-pass-card" class="pass-card">
        
        <div class="pass-content">
          <p class="event-type" id="display-event-type">EVENTO</p>
          <h3 class="event-title" id="display-event-title">CARGANDO...</h3>
          
          <div class="divider"></div>

          <h1 class="guest-fullname" id="display-guest-name">CARGANDO...</h1>
          
          <p class="passes-title">PASES</p>
          <div class="passes-number" id="display-confirmed-passes">0</div>

          <!-- Código QR -->
          <div class="qr-container">
            <div id="qrcode"></div>
          </div>

          <p class="instructions">PRESENTA ESTE PASE PARA INGRESAR</p>

          <div class="code-box">
            <span class="code-title">CÓDIGO DE PASE</span>
            <span class="code-number" id="display-pass-code">AN-000-0000</span>
          </div>
        </div>

        <footer class="pass-footer">
          <p>GRACIAS POR SER PARTE DE ESTE DÍA TAN ESPECIAL</p>
        </footer>

      </div>

      <!-- Botón de Descarga PNG -->
      <button type="button" id="download-btn" class="btn-download" onclick="downloadPassImage()">
        Descargar Pase (Imagen)
      </button>

    </section>

  </main>

  <script>
    let datosInvitadoGlobal = {};

    // Al cargar la página: Leer parámetro ID de la URL y pedir datos a Apps Script
    document.addEventListener("DOMContentLoaded", function () {
      const urlParams = new URLSearchParams(window.location.search);
      const idInvitado = urlParams.get('id') || urlParams.get('codigo');

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        // Conexión real con Google Apps Script (código.gs)
        google.script.run
          .withSuccessHandler(cargarDatosEnPantalla)
          .obtenerDatosInvitado(idInvitado);
      } else {
        // Datos de prueba locales en caso de abrir la plantilla fuera de Apps Script
        cargarDatosEnPantalla({
          tipoEvento: "XV AÑOS",
          nombreEvento: "XV DE PERLA",
          nombreInvitado: "DENISSE",
          pasesAutorizados: 3,
          codigoPase: "AN-XVP-0047",
          colorFondo: "#F7F4EE",
          colorTarjeta: "#F3ECE0",
          colorTexto: "#3E332E",
          colorAcento: "#8C7355",
          colorBoton: "#332821"
        });
      }
    });

    // Función que recibe los datos desde el Excel (código.gs)
    function cargarDatosEnPantalla(datos) {
      if (!datos) return;
      datosInvitadoGlobal = datos;

      // 1. Aplicar colores personalizados del Excel
      aplicarColoresExcel(datos);

      // 2. Llenar los textos del formulario
      document.getElementById("guest-greeting-name").innerText = datos.nombreInvitado;
      document.getElementById("guest-passes-count").innerText = datos.pasesAutorizados;

      // 3. Crear inputs según los pases permitidos
      const container = document.getElementById("inputs-container");
      container.innerHTML = "";
      for (let i = 1; i <= datos.pasesAutorizados; i++) {
        const input = document.createElement("input");
        input.type = "text";
        input.placeholder = `Nombre Asistente ${i}`;
        input.className = "input-asistente";
        if (i === 1) input.value = datos.nombreInvitado;
        container.appendChild(input);
      }
    }

    // Aplicar estilos dinámicos CSS
    function aplicarColoresExcel(datosExcel) {
      const root = document.documentElement;
      if (datosExcel.colorFondo) root.style.setProperty('--bg-color', datosExcel.colorFondo);
      if (datosExcel.colorTarjeta) root.style.setProperty('--card-bg', datosExcel.colorTarjeta);
      if (datosExcel.colorTexto) {
        root.style.setProperty('--primary-color', datosExcel.colorTexto);
        root.style.setProperty('--text-dark', datosExcel.colorTexto);
      }
      if (datosExcel.colorAcento) root.style.setProperty('--accent-color', datosExcel.colorAcento);
      if (datosExcel.colorBoton) root.style.setProperty('--btn-bg', datosExcel.colorBoton);
    }

    // Enviar la confirmación
    document.getElementById("attendance-form").addEventListener("submit", function (e) {
      e.preventDefault();

      const btnSubmit = document.getElementById("btn-submit-form");
      btnSubmit.innerText = "GUARDANDO...";
      btnSubmit.disabled = true;

      // Recopilar nombres ingresados
      const inputs = document.querySelectorAll(".input-asistente");
      const asistentesConfirmados = [];
      inputs.forEach(input => {
        if (input.value.trim() !== "") {
          asistentesConfirmados.push(input.value.trim());
        }
      });

      const totalConfirmados = asistentesConfirmados.length || datosInvitadoGlobal.pasesAutorizados;

      // Guardar en Apps Script / Google Sheets
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function() {
            mostrarPaseConfirmado(totalConfirmados);
          })
          .registrarConfirmacion(datosInvitadoGlobal.codigoPase, asistentesConfirmados);
      } else {
        mostrarPaseConfirmado(totalConfirmados);
      }
    });

    // Muestra la tarjeta del pase con la información personalizada
    function mostrarPaseConfirmado(pasesConfirmados) {
      document.getElementById("display-event-type").innerText = datosInvitadoGlobal.tipoEvento || "EVENTO";
      document.getElementById("display-event-title").innerText = datosInvitadoGlobal.nombreEvento || "NOMBRE DEL EVENTO";
      document.getElementById("display-guest-name").innerText = datosInvitadoGlobal.nombreInvitado || "INVITADO";
      document.getElementById("display-confirmed-passes").innerText = pasesConfirmados;
      document.getElementById("display-pass-code").innerText = datosInvitadoGlobal.codigoPase || "AN-000-0000";

      document.getElementById("form-step").classList.add("hidden");
      document.getElementById("ticket-step").classList.remove("hidden");

      generarQR(datosInvitadoGlobal.codigoPase || "AN-000-0000");
    }

    // Generar el código QR adaptado
    function generarQR(codigo) {
      const qrContainer = document.getElementById("qrcode");
      qrContainer.innerHTML = "";

      const colorTexto = getComputedStyle(document.documentElement).getPropertyValue('--primary-color').trim() || "#000000";

      new QRCode(qrContainer, {
        text: codigo,
        width: 160,
        height: 160,
        colorDark: colorTexto,
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    // Descargar el pase como imagen PNG
    function downloadPassImage() {
      const passElement = document.getElementById("digital-pass-card");

      html2canvas(passElement, {
        scale: 3,
        useCORS: true,
        backgroundColor: null
      }).then(canvas => {
        const guestName = document.getElementById("display-guest-name").innerText || "Pase";
        const link = document.createElement("a");
        link.download = `Pase_${guestName.replace(/\s+/g, '_')}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    }
  </script>
</body>
</html>

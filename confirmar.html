<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AN PASS - Confirmación</title>


<style>

*{
  box-sizing:border-box;
}


body{

  margin:0;

  background:#f7f3ed;

  color:#292522;

  font-family:Arial,sans-serif;

}


.app{

  width:100%;

  max-width:500px;

  margin:auto;

  padding:30px 18px 60px;

}



header{

  text-align:center;

  margin-bottom:25px;

}



.logo{

  font-family:Georgia,serif;

  font-size:32px;

  line-height:.8;

  letter-spacing:3px;

}


.logo span{

  font-size:20px;

  letter-spacing:6px;

}



.subtitulo{

  margin-top:15px;

  font-size:9px;

  letter-spacing:3px;

  color:#766b60;

}




.tarjeta{

  background:white;

  border:1px solid #e5ddd2;

  border-radius:22px;

  padding:25px 18px;

  box-shadow:0 5px 18px rgba(70,60,50,.07);

  text-align:center;

}



.nombreFamilia{

  font-family:Georgia,serif;

  font-size:27px;

  margin:5px 0 10px;

}



.descripcion{

  color:#706860;

  font-size:13px;

  line-height:1.5;

}



.cantidad{

  background:#f7f3ed;

  border-radius:15px;

  padding:18px;

  margin:20px 0;

}



.cantidad strong{

  display:block;

  font-family:Georgia,serif;

  font-size:38px;

}



.cantidad small{

  font-size:9px;

  font-weight:bold;

  letter-spacing:1px;

}




.campo{

  text-align:left;

  margin-bottom:13px;

}



.campo label{

  display:block;

  font-size:9px;

  font-weight:bold;

  margin-bottom:6px;

}



.campo input{

  width:100%;

  padding:13px;

  border:1px solid #ddd3c7;

  border-radius:12px;

  font-size:14px;

}



.boton{

  width:100%;

  border:0;

  border-radius:13px;

  padding:16px;

  background:#292522;

  color:white;

  font-size:14px;

  font-weight:bold;

}



.boton:disabled{

 opacity:.6;

}



.icono{

 font-size:52px;

}



.mensaje{

 text-align:center;

 padding:15px;

}



.qr{

 width:220px;

 height:220px;

 margin:15px auto;

 display:block;

}



.listaNombres{

 background:#f7f3ed;

 border-radius:15px;

 padding:15px;

 margin-top:20px;

 text-align:left;

}



.listaNombres strong{

 display:block;

 font-size:10px;

 letter-spacing:1px;

 margin-bottom:10px;

}



.listaNombres div{

 padding:5px 0;

 border-bottom:1px solid #e5ddd2;

 font-size:13px;

}



.error{

 color:#8b443b;

}


</style>


</head>


<body>


<div class="app">


<header>

<div class="logo">
AN<br>
<span>PASS</span>
</div>


<div class="subtitulo">
CONFIRMACIÓN DE ASISTENCIA
</div>


</header>



<div id="contenido">


<div class="tarjeta">

<div class="mensaje">

Cargando invitación...

</div>

</div>


</div>


</div>

  <script>

// =====================================================
// CONFIGURACIÓN
// =====================================================

const URL_APPS_SCRIPT =
'https://script.google.com/macros/s/AKfycbxd7P-bKlxZAYbd1yHJHxT4sOWRpRuLGIlWNqG4gWt-3dFAmETStniOaZbNlxa2ui2QCA/exec';


// =====================================================
// DATOS DE LA URL
// =====================================================

const parametros =
new URLSearchParams(
  window.location.search
);


const codigo =
String(
  parametros.get('codigo') || ''
)
.trim();


const evento =
String(
  parametros.get('evento') || ''
)
.trim()
.toUpperCase();



// =====================================================
// API
// =====================================================

function solicitarAPI(
  accion,
  datos={}
){

datos.accion = accion;

datos.idEvento = evento;


return fetch(
URL_APPS_SCRIPT,
{

method:'POST',

mode:'cors',

headers:{
'Content-Type':
'text/plain;charset=utf-8'
},

body:
JSON.stringify(datos)

}

)

.then(
respuesta =>
respuesta.json()
);


}



// =====================================================
// SEGURIDAD TEXTO
// =====================================================

function escapar(texto){

if(
texto===null ||
texto===undefined
){

return '';

}


return String(texto)

.replace(/&/g,'&amp;')

.replace(/</g,'&lt;')

.replace(/>/g,'&gt;')

.replace(/"/g,'&quot;')

.replace(/'/g,'&#039;');

}



// =====================================================
// INICIO
// =====================================================

window.onload=function(){


if(
!codigo ||
!evento
){

mostrarError(
'Código o evento incorrecto.'
);

return;

}


cargarInvitacion();


};



// =====================================================
// CARGAR INVITACIÓN
// =====================================================

function cargarInvitacion(){


solicitarAPI(

'obtenerDatosConfirmacion',

{
codigo:codigo
}

)


.then(
function(datos){



if(
!datos ||
!datos.ok
){

mostrarError(
datos?.mensaje ||
'La invitación no existe.'
);

return;

}



// ===============================
// AQUÍ ESTABA EL ERROR
// ===============================
// Si ya está confirmada,
// NO mostramos formulario.
// Mostramos QR.


if(
String(
datos.confirmacion || ''
)
.toUpperCase()
===
'CONFIRMADO'
){


mostrarConfirmacionExistente(
datos
);


return;


}




mostrarFormulario(
datos
);



}

)



.catch(
function(error){

console.error(error);

mostrarError(
'No se pudo conectar con el sistema.'
);


}

);


}



// =====================================================
// FORMULARIO
// =====================================================

function mostrarFormulario(
datos
){


let campos='';



for(
let i=1;
i<=datos.personas;
i++
){


campos += `

<div class="campo">

<label>
NOMBRE DEL INVITADO ${i}
</label>


<input

id="nombre${i}"

type="text"

placeholder="Nombre completo"

/>


</div>


`;


}



document
.getElementById('contenido')
.innerHTML = `


<div class="tarjeta">


<div class="nombreFamilia">

${escapar(datos.invitado)}

</div>



<div class="descripcion">

Nos dará mucho gusto contar contigo.
Por favor confirma quiénes asistirán.

</div>



<div class="cantidad">

<strong>

${datos.personas}

</strong>


<small>

PASES DISPONIBLES

</small>


</div>


${campos}



<button

class="boton"

id="btnConfirmar"

>

CONFIRMAR ASISTENCIA

</button>



</div>


`;



document
.getElementById('btnConfirmar')
.addEventListener(
'click',
confirmar
);



}

// =====================================================
// CONFIRMAR ASISTENCIA
// =====================================================

function confirmar(){


const nombres=[];


for(
let i=1;
i<=100;
i++
){


const campo =
document.getElementById(
'nombre'+i
);


if(!campo)
break;



const nombre =
campo.value.trim();



if(!nombre){

alert(
'Escribe todos los nombres antes de confirmar.'
);

campo.focus();

return;

}


nombres.push(nombre);


}




const boton =
document.getElementById(
'btnConfirmar'
);



boton.disabled=true;

boton.textContent=
'CONFIRMANDO...';



solicitarAPI(

'confirmarAsistencia',

{
codigo:codigo,
nombres:nombres
}

)


.then(

function(respuesta){



if(
respuesta.yaConfirmado
){

cargarInvitacion();

return;

}



if(
!respuesta ||
!respuesta.ok
){


alert(
respuesta?.mensaje ||
'No se pudo confirmar.'
);


boton.disabled=false;

boton.textContent=
'CONFIRMAR ASISTENCIA';


return;


}




mostrarConfirmacion({

codigo:codigo,

invitado:respuesta.invitado,

personas:
respuesta.personas,

nombres:
respuesta.nombres


});



}

)



.catch(

function(){

alert(
'Error al confirmar.'
);


boton.disabled=false;


}

);


}



// =====================================================
// MOSTRAR CONFIRMACIÓN EXISTENTE
// =====================================================


function mostrarConfirmacionExistente(
datos
){


mostrarConfirmacion({

codigo:
datos.codigo,

invitado:
datos.invitado,

personas:
datos.personas,

nombres:
datos.nombres || []

});


}




// =====================================================
// PANTALLA FINAL CON QR
// =====================================================


function mostrarConfirmacion(
datos
){


let lista='';


(datos.nombres || [])
.forEach(

function(nombre){

lista += `

<div>
${escapar(nombre)}
</div>

`;

}

);





const qrURL =

'https://quickchart.io/qr?size=500&text='

+

encodeURIComponent(

datos.codigo

);






document
.getElementById('contenido')
.innerHTML = `



<div class="tarjeta">



<div class="mensaje">


<div class="icono">

✅

</div>


<h2>

¡Asistencia confirmada!

</h2>



<p>

Gracias por confirmar.

</p>


</div>





<div class="listaNombres">


<strong>

INVITADOS CONFIRMADOS

</strong>


${lista}


</div>





<h3>

TU PASE QR

</h3>




<img

class="qr"

src="${qrURL}"

alt="QR Pase"



>



<p>

Código:

<b>

${escapar(datos.codigo)}

</b>


</p>



<p>

Guarda este código para ingresar al evento.

</p>




</div>



`;



}




// =====================================================
// ERROR
// =====================================================


function mostrarError(
mensaje
){


document
.getElementById('contenido')
.innerHTML = `


<div class="tarjeta">


<div class="mensaje error">


<div class="icono">

❌

</div>



<h2>

No pudimos abrir tu invitación

</h2>



<p>

${escapar(mensaje)}

</p>



</div>


</div>


`;

}


</script>


</body>

</html>

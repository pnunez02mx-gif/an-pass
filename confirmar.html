<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AN PASS - Confirmación</title>

<!-- Librerías para generar el QR y descargar el ticket como imagen -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
:root{
  --color-principal:#292522;
  --color-fondo:#f7f3ed;
  --color-boton:#292522;
  --color-tarjeta:#ffffff;
  --color-borde:#e5ddd2;
  --color-secundario:#706860;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:var(--color-fondo);
  color:var(--color-principal);
  font-family:Arial,Helvetica,sans-serif;
  -webkit-font-smoothing:antialiased;
}

.app{
  width:100%;
  max-width:520px;
  margin:0 auto;
  padding:28px 18px 55px;
}

header{
  text-align:center;
  margin-bottom:24px;
}

.logo{
  font-family:Georgia,"Times New Roman",serif;
  font-size:34px;
  line-height:.82;
  letter-spacing:4px;
  color:var(--color-principal);
}

.logo span{
  display:block;
  font-size:18px;
  letter-spacing:7px;
}

.nombreEvento{
  margin-top:18px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:21px;
  line-height:1.25;
  color:var(--color-principal);
}

.subtitulo{
  margin-top:10px;
  font-size:9px;
  letter-spacing:3px;
  color:var(--color-secundario);
}

.logoEvento{
  display:block;
  width:auto;
  max-width:180px;
  max-height:100px;
  margin:0 auto 15px;
  object-fit:contain;
}

.tarjeta{
  width:100%;
  background:var(--color-tarjeta);
  border:1px solid var(--color-borde);
  border-radius:22px;
  padding:25px 18px 22px;
  box-shadow:0 5px 18px rgba(70,60,50,.07);
  text-align:center;
}

.nombreFamilia{
  font-family:Georgia,"Times New Roman",serif;
  font-size:27px;
  line-height:1.2;
  margin:5px 0 10px;
  color:var(--color-principal);
}

.descripcion{
  color:var(--color-secundario);
  font-size:13px;
  line-height:1.5;
}

.cantidad{
  background:var(--color-fondo);
  border-radius:15px;
  padding:18px;
  margin:20px 0;
}

.cantidad strong{
  display:block;
  font-family:Georgia,"Times New Roman",serif;
  font-size:38px;
  line-height:1;
  color:var(--color-principal);
}

.cantidad small{
  display:block;
  margin-top:6px;
  font-size:9px;
  font-weight:bold;
  letter-spacing:1px;
  color:var(--color-principal);
}

.campo{
  width:100%;
  text-align:left;
  margin-bottom:14px;
}

.campo label{
  display:block;
  font-size:9px;
  font-weight:bold;
  margin-bottom:6px;
  color:var(--color-principal);
}

.campo input{
  display:block;
  width:100%;
  height:46px;
  padding:12px 13px;
  border:1px solid var(--color-borde);
  border-radius:12px;
  background:#fff;
  color:var(--color-principal);
  font-size:14px;
  outline:none;
}

.campo input:focus{
  border-color:var(--color-principal);
  box-shadow:0 0 0 3px rgba(0,0,0,.08);
}

.campo input::placeholder{color:#aaa29a}

#zonaBoton{
  display:block;
  width:100%;
  margin-top:22px;
}

button.boton{
  display:block;
  width:100%;
  min-height:52px;
  padding:15px 18px;
  border:none;
  border-radius:13px;
  background:var(--color-boton);
  color:#fff;
  font-size:14px;
  font-weight:bold;
  letter-spacing:.4px;
  cursor:pointer;
}

button.boton:active{transform:scale(.98)}

button.boton:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.mensaje{
  text-align:center;
  padding:15px;
}

.icono{
  font-size:52px;
  line-height:1;
  margin-bottom:10px;
}

.mensaje h2{
  font-family:Georgia,"Times New Roman",serif;
  color:var(--color-principal);
  margin:10px 0;
}

.mensaje p{
  color:var(--color-secundario);
  font-size:13px;
  line-height:1.5;
}

.error{color:#8b443b}
.error h2{color:#8b443b}

/* =====================================================
   TICKET AN PASS
   ===================================================== */

.ticketWrap{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.ticket{
  width:100%;
  max-width:430px;
  background:#fff;
  border:1px solid var(--color-borde);
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 12px 30px rgba(0,0,0,.12);
}

.ticketHeader{
  background:var(--color-principal);
  color:#fff;
  text-align:center;
  padding:24px 20px;
}

.ticketHeader .textoPase{
  font-family:Georgia,"Times New Roman",serif;
  font-size:20px;
  letter-spacing:2px;
}

.ticketBody{
  padding:25px 22px 22px;
  text-align:center;
}

.confirmado .checkTicket{
  width:42px;
  height:42px;
  margin:0 auto 10px;
  border-radius:50%;
  background:#4fbd73;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:bold;
}

.confirmado h2{
  margin:0 0 24px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:24px;
  color:var(--color-principal);
}

.etiquetaTicket{
  text-align:left;
  font-size:9px;
  font-weight:bold;
  letter-spacing:2px;
  color:var(--color-secundario);
  margin-bottom:7px;
}

.nombresTicket{
  text-align:left;
}

.nombreTicket{
  padding:9px 0;
  border-bottom:1px solid var(--color-borde);
  color:var(--color-principal);
  font-family:Georgia,"Times New Roman",serif;
  font-size:17px;
}

.lineaPunteada{
  margin:22px 0;
  border-top:2px dashed var(--color-borde);
}

.zonaQR{
  text-align:center;
}

.qrCanvas{
  display:block;
  width:190px;
  height:190px;
  margin:8px auto 12px;
  image-rendering:auto;
}

.codigoTicketLabel{
  font-size:9px;
  letter-spacing:2px;
  color:var(--color-secundario);
}

.codigoTicket{
  margin-top:4px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:25px;
  font-weight:bold;
  letter-spacing:4px;
  color:var(--color-principal);
}

.textoGuardar{
  margin-top:18px;
  color:var(--color-secundario);
  font-size:9px;
  letter-spacing:1.5px;
}

.ticketFooter{
  background:var(--color-fondo);
  padding:15px 18px;
  text-align:center;
  color:var(--color-secundario);
  font-size:9px;
  letter-spacing:1.8px;
  border-top:1px solid var(--color-borde);
}

.descargarBoton{
  margin-top:18px;
  max-width:430px;
}

@media(max-width:380px){
  .app{padding:22px 14px 45px}
  .nombreEvento{font-size:18px}
  .tarjeta{padding:22px 15px 20px}
  .nombreFamilia{font-size:24px}
  .cantidad strong{font-size:34px}
  .ticketBody{padding:22px 17px 20px}
  .qrCanvas{width:175px;height:175px}
}
</style>
</head>

<body>

<div class="app">

  <header>
    <div id="logoEvento" class="logo">
      AN<br>
      <span>PASS</span>
    </div>

    <div id="nombreEvento" class="nombreEvento"></div>

    <div class="subtitulo">
      CONFIRMACIÓN DE ASISTENCIA
    </div>
  </header>

  <div id="contenido">
    <div class="tarjeta">
      <div class="mensaje">
        Cargando invitación...
      </div>
    </div>
  </div>

</div>

<script>
/* =====================================================
   URL DEL APPS SCRIPT
   ===================================================== */

const URL_APPS_SCRIPT =
'https://script.google.com/macros/s/AKfycbxd7P-bKlxZAYbd1yHJHxT4sOWRpRuLGIlWNqG4gWt-3dFAmETStniOaZbNlxa2ui2QCA/exec';


/* =====================================================
   DATOS DE LA URL
   ===================================================== */

const parametros =
new URLSearchParams(window.location.search);

const codigo =
String(parametros.get('codigo') || '').trim();

const evento =
String(parametros.get('evento') || '').trim().toUpperCase();


/* =====================================================
   CONFIGURACIÓN VISUAL DEL EVENTO
   ===================================================== */

let configuracionEvento = {
  color:'#292522',
  color_fondo:'#f7f3ed',
  color_boton:'#292522',
  imagen:''
};


/* =====================================================
   ESCAPAR HTML
   ===================================================== */

function escapar(texto){

  if(texto === null || texto === undefined){
    return '';
  }

  return String(texto)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}


/* =====================================================
   APLICAR CONFIGURACIÓN DEL EVENTO
   ===================================================== */

function aplicarConfiguracionEvento(datos){

  const eventoDatos =
    datos.eventoDatos ||
    datos.configuracion ||
    {};

  const color =
    eventoDatos.color ||
    eventoDatos.COLOR ||
    datos.color ||
    datos.COLOR ||
    '#292522';

  const colorFondo =
    eventoDatos.color_fondo ||
    eventoDatos.COLOR_FONDO ||
    eventoDatos.colorFondo ||
    datos.color_fondo ||
    datos.COLOR_FONDO ||
    datos.colorFondo ||
    '#f7f3ed';

  const colorBoton =
    eventoDatos.color_boton ||
    eventoDatos.COLOR_BOTON ||
    eventoDatos.colorBoton ||
    datos.color_boton ||
    datos.COLOR_BOTON ||
    datos.colorBoton ||
    color;

  const imagen =
    eventoDatos.imagen ||
    eventoDatos.IMAGEN ||
    datos.imagen ||
    datos.IMAGEN ||
    '';

  configuracionEvento.color = color;
  configuracionEvento.color_fondo = colorFondo;
  configuracionEvento.color_boton = colorBoton;
  configuracionEvento.imagen = imagen;

  document.documentElement.style.setProperty(
    '--color-principal',
    color
  );

  document.documentElement.style.setProperty(
    '--color-fondo',
    colorFondo
  );

  document.documentElement.style.setProperty(
    '--color-boton',
    colorBoton
  );

  if(imagen){
    mostrarImagenEvento(imagen);
  }
}


/* =====================================================
   NOMBRE DEL EVENTO
   ===================================================== */

function mostrarNombreEvento(datos){

  const elemento =
    document.getElementById('nombreEvento');

  if(!elemento){
    return;
  }

  const nombre =
    datos.evento ||
    datos.nombreEvento ||
    datos.nombre_evento ||
    '';

  if(nombre){
    elemento.textContent = nombre;
    elemento.style.display = 'block';
  }else{
    elemento.style.display = 'none';
  }
}


/* =====================================================
   IMAGEN DEL EVENTO
   ===================================================== */

function mostrarImagenEvento(imagen){

  if(!imagen){
    return;
  }

  const encabezado =
    document.querySelector('header');

  if(!encabezado){
    return;
  }

  let imagenElemento =
    document.getElementById('imagenEvento');

  if(!imagenElemento){

    imagenElemento =
      document.createElement('img');

    imagenElemento.id = 'imagenEvento';
    imagenElemento.className = 'logoEvento';
    imagenElemento.alt = 'Logo del evento';

    const nombre =
      document.getElementById('nombreEvento');

    encabezado.insertBefore(
      imagenElemento,
      nombre
    );
  }

  imagenElemento.src = imagen;
}


/* =====================================================
   API
   ===================================================== */

function solicitarAPI(accion, datos={}){

  datos.accion = accion;
  datos.idEvento = evento;

  return fetch(
    URL_APPS_SCRIPT,
    {
      method:'POST',
      mode:'cors',
      headers:{
        'Content-Type':'text/plain;charset=utf-8'
      },
      body:JSON.stringify(datos)
    }
  ).then(function(respuesta){

    if(!respuesta.ok){
      throw new Error(
        'Respuesta HTTP ' + respuesta.status
      );
    }

    return respuesta.json();
  });
}


/* =====================================================
   INICIO
   ===================================================== */

window.addEventListener('load', function(){

  if(!codigo || !evento){

    mostrarError(
      'Código o evento incorrecto.'
    );

    return;
  }

  cargarInvitacion();
});


/* =====================================================
   CARGAR INVITACIÓN
   ===================================================== */

function cargarInvitacion(){

  solicitarAPI(
    'obtenerDatosConfirmacion',
    {
      codigo:codigo
    }
  )
  .then(function(datos){

    if(!datos || !datos.ok){

      mostrarError(
        (datos && datos.mensaje) ||
        'La invitación no existe o no pertenece a este evento.'
      );

      return;
    }

    aplicarConfiguracionEvento(datos);
    mostrarNombreEvento(datos);

    if(
      String(datos.confirmacion || '')
        .trim()
        .toUpperCase() === 'CONFIRMADO'
    ){

      mostrarConfirmacionExistente(datos);
      return;
    }

    mostrarFormulario(datos);
  })
  .catch(function(error){

    console.error(error);

    mostrarError(
      'No se pudo conectar con el sistema.'
    );
  });
}


/* =====================================================
   FORMULARIO
   ===================================================== */

function mostrarFormulario(datos){

  let campos = '';

  const cantidad =
    Number(datos.personas) || 0;

  for(let i=1; i<=cantidad; i++){

    campos += `
      <div class="campo">
        <label>
          NOMBRE DEL INVITADO ${i}
        </label>

        <input
          id="nombre${i}"
          type="text"
          placeholder="Nombre completo"
          autocomplete="name"
        >
      </div>
    `;
  }

  document.getElementById('contenido').innerHTML = `

    <div class="tarjeta">

      <div class="nombreFamilia">
        ${escapar(datos.invitado)}
      </div>

      <div class="descripcion">
        Nos dará mucho gusto contar contigo.
        Por favor confirma quiénes asistirán.
      </div>

      <div class="cantidad">

        <strong>
          ${cantidad}
        </strong>

        <small>
          PASES DISPONIBLES
        </small>

      </div>

      ${campos}

      <div id="zonaBoton"></div>

    </div>
  `;

  const zonaBoton =
    document.getElementById('zonaBoton');

  if(!zonaBoton){
    return;
  }

  const boton =
    document.createElement('button');

  boton.type = 'button';
  boton.id = 'btnConfirmar';
  boton.className = 'boton';
  boton.textContent = 'CONFIRMAR ASISTENCIA';

  zonaBoton.appendChild(boton);

  boton.addEventListener(
    'click',
    confirmar
  );
}


/* =====================================================
   CONFIRMAR ASISTENCIA
   ===================================================== */

function confirmar(){

  const nombres = [];

  for(let i=1; i<=100; i++){

    const campo =
      document.getElementById(
        'nombre' + i
      );

    if(!campo){
      break;
    }

    const nombre =
      campo.value.trim();

    if(!nombre){

      alert(
        'Escribe todos los nombres antes de confirmar.'
      );

      campo.focus();
      return;
    }

    nombres.push(nombre);
  }

  if(nombres.length === 0){

    alert(
      'Agrega al menos un nombre.'
    );

    return;
  }

  const boton =
    document.getElementById('btnConfirmar');

  if(boton){

    boton.disabled = true;
    boton.textContent = 'CONFIRMANDO...';
  }

  solicitarAPI(
    'confirmarAsistencia',
    {
      codigo:codigo,
      nombres:nombres
    }
  )
  .then(function(respuesta){

    if(
      respuesta &&
      respuesta.yaConfirmado
    ){

      cargarInvitacion();
      return;
    }

    if(!respuesta || !respuesta.ok){

      alert(
        (respuesta && respuesta.mensaje) ||
        'No se pudo confirmar.'
      );

      if(boton){

        boton.disabled = false;
        boton.textContent =
          'CONFIRMAR ASISTENCIA';
      }

      return;
    }

    mostrarConfirmacion({
      codigo:codigo,
      invitado:respuesta.invitado,
      personas:respuesta.personas,
      nombres:nombres
    });
  })
  .catch(function(error){

    console.error(error);

    alert(
      'Error al confirmar.'
    );

    if(boton){

      boton.disabled = false;
      boton.textContent =
        'CONFIRMAR ASISTENCIA';
    }
  });
}


/* =====================================================
   CONFIRMACIÓN EXISTENTE
   ===================================================== */

function mostrarConfirmacionExistente(datos){

  mostrarConfirmacion({
    codigo:datos.codigo,
    invitado:datos.invitado,
    personas:datos.personas,
    nombres:datos.nombres || []
  });
}


/* =====================================================
   PANTALLA FINAL - TICKET
   ===================================================== */

function mostrarConfirmacion(datos){

  let lista = '';

  (datos.nombres || []).forEach(function(nombre){

    lista += `
      <div class="nombreTicket">
        ${escapar(nombre)}
      </div>
    `;
  });

  document.getElementById('contenido').innerHTML = `

    <div class="ticketWrap">

      <div
        id="ticketParaDescargar"
        class="ticket"
      >

        <div class="ticketHeader">
          <div class="textoPase">
            PASE DE ACCESO
          </div>
        </div>

        <div class="ticketBody">

          <div class="confirmado">

            <div class="checkTicket">
              ✓
            </div>

            <h2>
              ¡Asistencia confirmada!
            </h2>

          </div>

          <div class="bloqueTicket">

            <div class="etiquetaTicket">
              INVITADOS
            </div>

            <div class="nombresTicket">
              ${lista}
            </div>

          </div>

          <div class="lineaPunteada"></div>

          <div class="zonaQR">

            <div
              id="qrTicket"
              class="qrCanvas"
            ></div>

            <div class="codigoTicketLabel">
              CÓDIGO DE ACCESO
            </div>

            <div class="codigoTicket">
              ${escapar(datos.codigo)}
            </div>

          </div>

          <div class="lineaPunteada"></div>

          <div class="textoGuardar">
            GUARDA ESTE PASE Y PRESENTALO AL INGRESAR
          </div>

        </div>

        <div class="ticketFooter">
          PASE DIGITAL DE ACCESO
        </div>

      </div>

      <button
        type="button"
        class="boton descargarBoton"
        id="btnDescargarPase"
        onclick="descargarPaseImagen()"
      >
        ↓ DESCARGAR MI PASE
      </button>

    </div>
  `;

  generarQR(datos.codigo);
}


/* =====================================================
   GENERAR QR
   ===================================================== */

function generarQR(codigoQR){

  const contenedor =
    document.getElementById('qrTicket');

  if(!contenedor){
    return;
  }

  contenedor.innerHTML = '';

  if(typeof QRCode === 'undefined'){

    mostrarError(
      'No se pudo cargar el generador del QR.'
    );

    return;
  }

  new QRCode(
    contenedor,
    {
      text:String(codigoQR),
      width:190,
      height:190,
      colorDark:'#000000',
      colorLight:'#ffffff',
      correctLevel:QRCode.CorrectLevel.H
    }
  );
}


/* =====================================================
   DESCARGAR TICKET COMO IMAGEN
   ===================================================== */

async function descargarPaseImagen(){

  const ticket =
    document.getElementById(
      'ticketParaDescargar'
    );

  const boton =
    document.getElementById(
      'btnDescargarPase'
    );

  if(!ticket){

    alert(
      'No se encontró el pase.'
    );

    return;
  }

  if(typeof html2canvas === 'undefined'){

    alert(
      'No se pudo cargar el sistema de descarga.'
    );

    return;
  }

  if(boton){

    boton.disabled = true;
    boton.textContent = 'GENERANDO IMAGEN...';
  }

  try{

    /*
     * Esperar un momento para asegurarnos de que
     * el QR ya esté dibujado antes de capturar.
     */

    await new Promise(function(resolve){
      setTimeout(resolve,350);
    });

    const canvas =
      await html2canvas(
        ticket,
        {
          scale:3,
          useCORS:true,
          allowTaint:false,
          backgroundColor:'#ffffff',
          logging:false
        }
      );

    const imagen =
      canvas.toDataURL(
        'image/png',
        1
      );

    const enlace =
      document.createElement('a');

    enlace.href = imagen;

    enlace.download =
      'AN-PASS-' +
      codigo +
      '.png';

    document.body.appendChild(enlace);
    enlace.click();
    enlace.remove();

  }
  catch(error){

    console.error(
      'Error al generar el pase:',
      error
    );

    alert(
      'No se pudo generar la imagen del pase. Intenta nuevamente.'
    );

  }
  finally{

    if(boton){

      boton.disabled = false;
      boton.textContent =
        '↓ DESCARGAR MI PASE';
    }
  }
}


/* =====================================================
   ERROR
   ===================================================== */

function mostrarError(mensaje){

  document.getElementById(
    'contenido'
  ).innerHTML = `

    <div class="tarjeta">

      <div class="mensaje error">

        <div class="icono">
          ❌
        </div>

        <h2>
          No pudimos abrir tu invitación
        </h2>

        <p>
          ${escapar(mensaje)}
        </p>

      </div>

    </div>
  `;
}

</script>

</body>
</html>

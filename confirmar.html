<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación - AN PASS</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
  <style>
    body { background: #fcfbfa; font-family: 'Montserrat', sans-serif; display: flex; justify-content: center; padding: 20px; }
    .card { background: white; width: 100%; max-width: 400px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 28px; margin-bottom: 20px; color: #2c2825; }
    .input-field { width: 100%; padding: 12px; border: 1px solid #eae6df; border-radius: 10px; margin-bottom: 10px; text-align: center; font-size: 14px; box-sizing: border-box; }
    .btn { width: 100%; padding: 12px; background: #2c2825; color: white; border: none; border-radius: 10px; cursor: pointer; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
    .hidden { display: none; }
    .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #2c2825; border-radius: 50%; width: 25px; height: 25px; animation: spin 1s linear infinite; margin: 10px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="card">
  <h1 id="tituloEvento">Confirmar Asistencia</h1>
  
  <div id="loader" class="spinner"></div>

  <!-- FORMULARIO DIRECTO -->
  <div id="secFormulario" class="hidden">
    <p style="font-size: 14px; margin-bottom: 15px;">Hola <span id="lblInvitado" style="font-weight:600;"></span>. Tienes <span id="lblPases"></span> pases autorizados.</p>
    <div id="listaInputs" style="margin: 15px 0; text-align: left;"></div>
    <button class="btn" id="btnConfirmar" onclick="guardarConfirmacion()">Confirmar Asistencia</button>
  </div>

  <!-- RESULTADO QR -->
  <div id="secPase" class="hidden">
    <p style="color:#2e6027; font-weight:600; margin-bottom: 10px;">✅ ¡Asistencia Confirmada!</p>
    <canvas id="qrCanvas"></canvas>
    <p style="font-size:12px; margin-top:10px; color:#666;">Muestra este código en la entrada del evento.</p>
  </div>
  
  <div id="secError" class="hidden">
    <p id="lblError" style="color:red; font-size: 13px;"></p>
  </div>
</div>

<script>
  const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbxd7P-bKlxZAYbd1yHJHxT4sOWRpRuLGIlWNqG4gWt-3dFAmETStniOaZbNlxa2ui2QCA/exec';
  
  const urlParams = new URLSearchParams(window.location.search);
  const EVENTO = urlParams.get('evento') || 'EV001';
  const CODIGO = urlParams.get('codigo') || '';

  window.onload = function() {
    if (!CODIGO) {
      document.getElementById('loader').classList.add('hidden');
      document.getElementById('secError').classList.remove('hidden');
      document.getElementById('lblError').textContent = 'No se encontró el código de invitación en el enlace.';
      return;
    }

    fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      body: JSON.stringify({ accion: 'obtenerDatosConfirmacion', id_evento: EVENTO, codigo: CODIGO })
    })
    .then(r => r.json())
    .then(res => {
      document.getElementById('loader').classList.add('hidden');
      if (res.ok) {
        document.getElementById('secFormulario').classList.remove('hidden');
        document.getElementById('lblInvitado').textContent = res.invitado;
        document.getElementById('lblPases').textContent = res.personas;
        
        let html = '';
        const cantidadPases = Number(res.personas) || 1;
        for(let i = 1; i <= cantidadPases; i++) {
          const valPrevio = (res.nombres && res.nombres[i-1]) ? res.nombres[i-1] : '';
          html += `<input type="text" class="input-field input-nombre" value="${valPrevio}" placeholder="Nombre Asistente ${i}">`;
        }
        document.getElementById('listaInputs').innerHTML = html;

        if (res.confirmacion === 'CONFIRMADO') {
          mostrarQR();
        }
      } else {
        document.getElementById('secError').classList.remove('hidden');
        document.getElementById('lblError').textContent = res.mensaje || 'Error al cargar invitación.';
      }
    })
    .catch(err => {
      document.getElementById('loader').classList.add('hidden');
      document.getElementById('secError').classList.remove('hidden');
      document.getElementById('lblError').textContent = 'Error de conexión.';
    });
  };

  function guardarConfirmacion() {
    const inputs = document.querySelectorAll('.input-nombre');
    const nombres = Array.from(inputs).map(i => i.value).filter(v => v.trim() !== "");
    
    if(nombres.length === 0) return alert("Por favor escribe al menos un nombre.");

    document.getElementById('btnConfirmar').disabled = true;
    document.getElementById('btnConfirmar').textContent = "Guardando...";

    fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      body: JSON.stringify({ 
        accion: 'confirmarAsistencia', 
        id_evento: EVENTO,
        codigo: CODIGO, 
        nombres: nombres 
      })
    })
    .then(r => r.json())
    .then(res => {
      if(res.ok) {
        mostrarQR();
      } else {
        alert("Error al guardar la confirmación.");
        document.getElementById('btnConfirmar').disabled = false;
        document.getElementById('btnConfirmar').textContent = "Confirmar Asistencia";
      }
    });
  }

  function mostrarQR() {
    document.getElementById('secFormulario').classList.add('hidden');
    document.getElementById('secPase').classList.remove('hidden');
    new QRious({ 
      element: document.getElementById('qrCanvas'), 
      value: "https://pnunez02mx-gif.github.io/an-pass/?evento=" + EVENTO + "&codigo=" + CODIGO, 
      size: 180 
    });
  }
</script>
</body>
</html>

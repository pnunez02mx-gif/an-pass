<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Invitados & Pases - AN PASS</title>
  
  <!-- Fuentes Elegantes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #fcfbfa;
      --card-bg: #ffffff;
      --text-main: #2c2825;
      --text-muted: #78716c;
      --accent-color: #2c2825;
      --border-color: #eae6df;
      --badge-yes-bg: #eef7ed;
      --badge-yes-text: #2e6027;
      --badge-maybe-bg: #fff8e6;
      --badge-maybe-text: #946800;
      --shadow-subtle: 0 10px 30px rgba(0, 0, 0, 0.04);
      --radius-main: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      padding: 24px 16px 40px 16px;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    /* HERO HEADER */
    .header {
      text-align: center;
      margin-bottom: 24px;
      padding: 10px 0;
    }

    .brand-tag {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent-color);
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
      opacity: 0.8;
    }

    .event-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.1;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 300;
      line-height: 1.4;
    }

    /* RESUMEN DE PASES */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-main);
      padding: 14px 8px;
      text-align: center;
      box-shadow: var(--shadow-subtle);
    }

    .stat-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    /* BARRA DE BÚSQUEDA */
    .search-box {
      margin-bottom: 20px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 14px 16px 14px 42px;
      border-radius: 12px;
      font-size: 13px;
      font-family: 'Montserrat', sans-serif;
      color: var(--text-main);
      outline: none;
      box-shadow: var(--shadow-subtle);
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
    }

    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
      pointer-events: none;
    }

    /* LISTA DE TARJETAS */
    .guest-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-main);
      padding: 18px 20px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-subtle);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .guest-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .guest-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 21px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.2;
    }

    .guest-phone {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-badge {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 5px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .status-badge.SI { background: var(--badge-yes-bg); color: var(--badge-yes-text); }
    .status-badge.TAL_VEZ { background: var(--badge-maybe-bg); color: var(--badge-maybe-text); }

    .guest-details {
      background: rgba(0, 0, 0, 0.02);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    .requested-count {
      color: var(--text-main);
      font-weight: 600;
    }

    /* ACCIÓN DE PASES */
    .action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .action-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
      color: var(--text-main);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .number-input {
      width: 58px;
      height: 40px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Montserrat', sans-serif;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s ease;
    }

    .number-input:focus {
      border-color: var(--accent-color);
    }

    .btn-approve {
      height: 40px;
      padding: 0 16px;
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-approve:active {
      transform: scale(0.97);
    }

    .btn-approve.success {
      background: #2e6027 !important;
    }

    /* ESTADOS VACÍOS Y CARGANDO */
    .state-message {
      text-align: center;
      padding: 50px 20px;
      background: var(--card-bg);
      border-radius: var(--radius-main);
      border: 1px dashed var(--border-color);
      color: var(--text-muted);
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(0, 0, 0, 0.1);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- ENCABEZADO -->
  <header class="header">
    <span class="brand-tag">Gestión de Invitados</span>
    <h1 class="event-title" id="tituloEvento">Cargando evento...</h1>
    <p class="subtitle">Confirma y autoriza la cantidad final de pases para la invitación formal.</p>
  </header>

  <!-- TARJETAS DE MÉTRICAS -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value" id="statFamilias">0</div>
      <div class="stat-label">Familias</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statPedidios">0</div>
      <div class="stat-label">Solicitados</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statAprobados">0</div>
      <div class="stat-label">Aprobados</div>
    </div>
  </div>

  <!-- BÚSQUEDA -->
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" class="search-input" placeholder="Buscar por nombre o teléfono..." onkeyup="filtrarInvitados()">
  </div>

  <!-- LISTADO DE INVITADOS -->
  <div id="lista" class="state-message">
    <div class="spinner"></div>
    <p style="font-size: 13px;">Cargando respuestas del Save the Date...</p>
  </div>

</div>

<script>
  const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbxd7P-bKlxZAYbd1yHJHxT4sOWRpRuLGIlWNqG4gWt-3dFAmETStniOaZbNlxa2ui2QCA/exec';
  const urlParams = new URLSearchParams(window.location.search);
  
  let ID_EVENTO = urlParams.get('evento') || 'EV001';
  if (ID_EVENTO.includes('](')) {
    ID_EVENTO = ID_EVENTO.split('](')[0].replace('[', '');
  }
  ID_EVENTO = ID_EVENTO.trim();

  let listaGlobal = [];

  function aplicarColoresEvento(color, colorFondo, colorBoton) {
    const root = document.documentElement;

    if (colorFondo) root.style.setProperty('--bg-color', colorFondo);
    if (color) root.style.setProperty('--text-main', color);
    if (colorBoton) {
      root.style.setProperty('--accent-color', colorBoton);
    } else if (color) {
      root.style.setProperty('--accent-color', color);
    }
  }

  function cargarLista() {
    // Primero obtener información del evento para los colores
    fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ accion: 'obtenerDatosPanel', id_evento: ID_EVENTO })
    })
    .then(res => res.json())
    .then(resInfo => {
      if (resInfo.ok && resInfo.evento) {
        document.getElementById('tituloEvento').textContent = resInfo.evento.nombre;
        aplicarColoresEvento(resInfo.evento.color, resInfo.evento.color_fondo, resInfo.evento.color_boton);
      }
    })
    .catch(() => {});

    // Cargar las solicitudes del Save the Date
    fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ accion: 'obtenerSolicitudesSTD', id_evento: ID_EVENTO })
    })
    .then(res => res.json())
    .then(res => {
      const cont = document.getElementById('lista');
      if (!res.ok) {
        cont.innerHTML = '<p style="color:red; font-size:13px;">' + res.mensaje + '</p>';
        return;
      }

      if (res.evento) {
        document.getElementById('tituloEvento').textContent = res.evento;
      }

      // Filtrar excluyendo "NO"
      listaGlobal = (res.solicitudes || []).filter(item => {
        const interes = String(item.interes || '').trim().toUpperCase();
        return interes !== 'NO';
      });

      actualizarMetricas();
      renderizarLista(listaGlobal);
    })
    .catch(() => {
      document.getElementById('lista').innerHTML = '<p style="color:red; font-size:13px;">Error al conectar con la base de datos.</p>';
    });
  }

  function actualizarMetricas() {
    let pedidios = 0;
    let aprobados = 0;

    listaGlobal.forEach(item => {
      pedidios += Number(item.solicitados) || 0;
      aprobados += Number(item.autorizados) || 0;
    });

    document.getElementById('statFamilias').textContent = listaGlobal.length;
    document.getElementById('statPedidios').textContent = pedidios;
    document.getElementById('statAprobados').textContent = aprobados;
  }

  function renderizarLista(items) {
    const cont = document.getElementById('lista');

    if (!items || items.length === 0) {
      cont.innerHTML = `
        <div class="state-message">
          <p style="font-size: 13px;">No hay pre-confirmaciones registradas por mostrar.</p>
        </div>
      `;
      return;
    }

    let html = '';
    items.forEach(item => {
      const tagClase = item.interes.replace(' ', '_');
      const tagTexto = item.interes === 'SÍ' ? 'Asistirá' : item.interes;

      html += `
        <div class="guest-card" id="card_${item.fila}">
          <div class="guest-card-header">
            <div>
              <div class="guest-name">${item.nombre}</div>
              <div class="guest-phone">📱 ${item.telefono || 'Sin celular registrado'}</div>
            </div>
            <span class="status-badge ${tagClase}">${tagTexto}</span>
          </div>

          <div class="guest-details">
            <span>Solicitó en Save the Date:</span>
            <span class="requested-count">${item.solicitados} pases</span>
          </div>

          <div class="action-row">
            <span class="action-label">Pases Autorizados:</span>
            <div class="control-group">
              <input type="number" id="pases_${item.fila}" class="number-input" value="${item.autorizados}" min="0" max="20" onchange="marcarCambio(${item.fila})">
              <button class="btn-approve" onclick="actualizarPases(${item.fila}, this)">Autorizar</button>
            </div>
          </div>
        </div>
      `;
    });

    cont.innerHTML = html;
  }

  function filtrarInvitados() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const filtrados = listaGlobal.filter(item => {
      const nombre = (item.nombre || '').toLowerCase();
      const tel = (item.telefono || '').toLowerCase();
      return nombre.includes(query) || tel.includes(query);
    });
    renderizarLista(filtrados);
  }

  function marcarCambio(fila) {
    const item = listaGlobal.find(x => x.fila === fila);
    if (item) {
      item.autorizados = Number(document.getElementById('pases_' + fila).value) || 0;
      actualizarMetricas();
    }
  }

  function actualizarPases(fila, btn) {
    const nuevoValor = document.getElementById('pases_' + fila).value;
    btn.disabled = true;
    btn.textContent = '...';

    fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        accion: 'guardarPasesAutorizados',
        id_evento: ID_EVENTO,
        fila: fila,
        pases: nuevoValor
      })
    })
    .then(res => res.json())
    .then(res => {
      if(res.ok) {
        btn.textContent = '✓ OK';
        btn.classList.add('success');

        // Actualizar en memoria local
        const item = listaGlobal.find(x => x.fila === fila);
        if (item) item.autorizados = Number(nuevoValor);
        actualizarMetricas();

        setTimeout(() => {
          btn.disabled = false;
          btn.textContent = 'Autorizar';
          btn.classList.remove('success');
        }, 1500);
      } else {
        alert(res.mensaje || 'Error al guardar');
        btn.disabled = false;
        btn.textContent = 'Autorizar';
      }
    })
    .catch(() => {
      alert('Error de conexión');
      btn.disabled = false;
      btn.textContent = 'Autorizar';
    });
  }

  cargarLista();
</script>

</body>
</html>
